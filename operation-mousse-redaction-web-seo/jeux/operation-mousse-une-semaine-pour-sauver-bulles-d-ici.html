<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Opération Mousse : le jeu de la rédaction web et du SEO</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500..700&family=DM+Sans:wght@400..700&display=swap">
<style>
:root{
  --bg:#FBF8F3; --surface:#FFFFFF; --soft:#F1EDF9; --text:#16163F; --muted:#565676;
  --line:#16163F; --shadow:#16163F;
  --coral:#FF5B3A; --violet:#5B3FD9; --yellow:#FFD23F; --mint:#3DDC97; --sky:#8FD3FF;
  --good:#18865A; --bad:#C8361A; --goodbg:#DDF7EA; --badbg:#FDE4DC;
  --on-color:#16163F;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121230; --surface:#1E1E4A; --soft:#2A2760; --text:#F3F0FA; --muted:#BDB9DD;
    --line:#F3F0FA; --shadow:#05051A; --good:#5BE3A4; --bad:#FF8A6B; --goodbg:#163D33; --badbg:#46201A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121230; --surface:#1E1E4A; --soft:#2A2760; --text:#F3F0FA; --muted:#BDB9DD;
  --line:#F3F0FA; --shadow:#05051A; --good:#5BE3A4; --bad:#FF8A6B; --goodbg:#163D33; --badbg:#46201A;
  color-scheme: dark;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
body{ margin:0; background:var(--bg); color:var(--text); font-family:'DM Sans', 'Trebuchet MS', Arial, sans-serif; font-size:17px; line-height:1.5; }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--violet); }
h1,h2,h3{ font-family:'Space Grotesk', 'Trebuchet MS', Arial, sans-serif; line-height:1.1; margin:0; }
p{ margin:0; }
button{ font:inherit; color:inherit; }
:focus-visible{ outline:3px solid var(--coral); outline-offset:3px; }

/* Barre du haut */
.top{ position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--violet); color:#FBF8F3; border-bottom:3px solid var(--line); }
.top-in{ max-width:960px; margin:0 auto; padding:12px 18px; display:flex; align-items:center; gap:14px; }
.logo{ font-family:'Space Grotesk', Arial, sans-serif; font-weight:700; font-size:20px; display:flex; align-items:center; gap:8px; background:none; border:0; color:inherit; cursor:pointer; padding:0; }
.logo-dot{ width:22px; height:22px; border-radius:50%; background:var(--yellow); border:3px solid #16163F; }
.xp{ margin-left:auto; display:flex; align-items:center; gap:10px; font-weight:700; }
.xp-bar{ width:120px; height:12px; border-radius:99px; background:rgba(255,255,255,.25); overflow:hidden; border:2px solid #16163F; }
.xp-fill{ height:100%; background:var(--yellow); width:0; transition:width .5s; }
.theme-btn{ background:none; border:2px solid #FBF8F3; color:#FBF8F3; border-radius:99px; padding:4px 10px; cursor:pointer; font-size:14px; }

main{ max-width:960px; margin:0 auto; padding:28px 18px 64px; }

/* Briques communes */
.card{ background:var(--surface); border:3px solid var(--line); border-radius:22px; box-shadow:6px 6px 0 var(--shadow); padding:24px; }
.btn{ display:inline-flex; align-items:center; gap:8px; cursor:pointer; border:3px solid var(--line); border-radius:14px; padding:12px 20px; font-weight:700; background:var(--yellow); color:var(--on-color); box-shadow:4px 4px 0 var(--shadow); transition:transform .08s, box-shadow .08s; }
.btn:hover{ transform:translate(-1px,-1px); box-shadow:5px 5px 0 var(--shadow); }
.btn:active{ transform:translate(3px,3px); box-shadow:1px 1px 0 var(--shadow); }
.btn.coral{ background:var(--coral); } .btn.mint{ background:var(--mint); } .btn.ghost{ background:var(--surface); color:var(--text); }
.btn:disabled{ opacity:.45; cursor:not-allowed; transform:none; }
.row{ display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
.muted{ color:var(--muted); }
.mt{ margin-top:18px; } .mt2{ margin-top:28px; }

/* Accueil */
.hero{ display:grid; grid-template-columns:1.2fr 1fr; gap:28px; align-items:center; }
.hero h1{ font-size:clamp(40px,7vw,72px); letter-spacing:-1px; }
.hero h1 span{ display:block; }
.bubbles{ position:relative; aspect-ratio:1; }
.bub{ position:absolute; border-radius:50%; border:3px solid var(--line); box-shadow:6px 6px 0 var(--shadow); }
.bub::after{ content:""; position:absolute; left:20%; top:16%; width:22%; height:22%; border-radius:50%; background:rgba(255,255,255,.7); }
@media (prefers-reduced-motion:no-preference){
  .bub{ animation:float 6s ease-in-out infinite; }
  .bub:nth-child(2){ animation-delay:-2s; } .bub:nth-child(3){ animation-delay:-4s; }
  @keyframes float{ 50%{ transform:translateY(-14px); } }
}
.brief{ display:grid; grid-template-columns:auto 1fr; gap:16px; align-items:start; }
.avatar{ width:64px; height:64px; border-radius:50%; border:3px solid var(--line); display:grid; place-items:center; font-family:'Space Grotesk', Arial, sans-serif; font-weight:700; font-size:24px; color:#16163F; }
.input{ font:inherit; padding:12px 14px; border:3px solid var(--line); border-radius:12px; background:var(--surface); color:var(--text); min-width:220px; }
.fiche{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.fiche div{ border:3px solid var(--line); border-radius:16px; padding:14px; color:#16163F; }

/* Carte des missions */
.map{ display:grid; grid-template-columns:repeat(5,1fr); gap:22px 14px; margin-top:24px; }
.node{ display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; background:none; border:0; cursor:pointer; padding:0; color:var(--text); }
.node:nth-child(even){ transform:translateY(34px); }
.node .ball{ width:min(110px,17vw); aspect-ratio:1; border-radius:50%; border:3px solid var(--line); box-shadow:5px 5px 0 var(--shadow); display:grid; place-items:center; font-family:'Space Grotesk', Arial, sans-serif; font-weight:700; font-size:clamp(22px,4vw,34px); color:#16163F; position:relative; }
.node .ball::after{ content:""; position:absolute; left:18%; top:14%; width:22%; height:22%; border-radius:50%; background:rgba(255,255,255,.7); }
.node.locked{ cursor:not-allowed; } .node.locked .ball{ background:var(--soft)!important; color:var(--muted); box-shadow:none; border-style:dashed; }
.node .t{ font-weight:700; font-size:14px; line-height:1.25; }
.node .s{ font-size:14px; color:var(--coral); letter-spacing:2px; min-height:20px; }

/* Mission */
.m-head{ display:flex; gap:16px; align-items:center; margin-bottom:18px; }
.m-num{ width:56px; height:56px; flex:none; border-radius:50%; border:3px solid var(--line); display:grid; place-items:center; font-family:'Space Grotesk', Arial, sans-serif; font-weight:700; font-size:22px; color:#16163F; }
.m-head h2{ font-size:clamp(26px,4.5vw,38px); }
.tag{ display:inline-block; font-size:14px; font-weight:700; padding:3px 12px; border-radius:99px; border:2px solid var(--line); background:var(--surface); }
.say{ background:var(--soft); border-radius:18px; padding:16px 18px; border:2px solid var(--line); }

/* Réordonner */
.order{ list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:10px; }
.order li{ display:flex; gap:12px; align-items:center; background:var(--surface); border:3px solid var(--line); border-radius:16px; padding:12px 14px; }
.order .pos{ width:34px; height:34px; flex:none; border-radius:50%; background:var(--yellow); border:2px solid var(--line); display:grid; place-items:center; font-weight:700; color:#16163F; }
.order .txt{ flex:1; }
.arrows{ display:flex; flex-direction:column; gap:4px; }
.arrows button{ width:40px; height:32px; border:2px solid var(--line); border-radius:8px; background:var(--soft); cursor:pointer; font-weight:700; }
.order li.ok{ border-color:var(--good); background:var(--goodbg); } .order li.ko{ border-color:var(--bad); background:var(--badbg); }

/* Cartes à trier (swipe) */
.deck{ position:relative; height:300px; max-width:520px; margin:10px auto 0; }
.swipe{ position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; gap:14px; text-align:center; touch-action:pan-y; user-select:none; cursor:grab; }
.swipe .q{ font-family:'Space Grotesk', Arial, sans-serif; font-size:clamp(22px,3.6vw,30px); font-weight:700; line-height:1.2; }
.swipe.behind{ transform:rotate(-3deg) translateY(10px); background:var(--yellow); }
.swipe.behind2{ transform:rotate(3deg) translateY(18px); background:var(--mint); }
.fly-left{ transition:transform .35s, opacity .35s; transform:translateX(-140%) rotate(-20deg)!important; opacity:0; }
.fly-right{ transition:transform .35s, opacity .35s; transform:translateX(140%) rotate(20deg)!important; opacity:0; }
.vf{ display:flex; justify-content:center; gap:16px; margin-top:22px; }
.vf .btn{ min-width:140px; justify-content:center; font-size:20px; }
.flash{ text-align:center; min-height:52px; margin-top:14px; font-weight:600; }

/* Relier */
.link-zone{ position:relative; display:grid; grid-template-columns:1fr 1fr; gap:16px 22%; }
.link-zone svg{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
.col{ display:flex; flex-direction:column; gap:12px; }
.pill{ border:3px solid var(--line); border-radius:14px; padding:12px 14px; background:var(--surface); cursor:pointer; text-align:left; font-weight:600; position:relative; z-index:1; min-height:58px; }
.pill.sel{ background:var(--yellow); color:#16163F; box-shadow:4px 4px 0 var(--shadow); }
.pill.linked{ background:var(--soft); }
.pill.ok{ background:var(--goodbg); border-color:var(--good); } .pill.ko{ background:var(--badbg); border-color:var(--bad); }

/* Bacs */
.pool{ display:flex; flex-wrap:wrap; gap:10px; min-height:60px; padding:14px; border:3px dashed var(--line); border-radius:18px; }
.chip{ border:3px solid var(--line); border-radius:99px; padding:8px 14px; background:var(--surface); cursor:grab; font-weight:600; font-size:15px; }
.chip.sel{ background:var(--yellow); color:#16163F; box-shadow:3px 3px 0 var(--shadow); }
.chip.ok{ background:var(--goodbg); border-color:var(--good); } .chip.ko{ background:var(--badbg); border-color:var(--bad); }
.bins{ display:grid; gap:14px; margin-top:16px; }
.bins.b4{ grid-template-columns:repeat(4,1fr); } .bins.b2{ grid-template-columns:1.4fr 1fr; }
.bin{ border:3px solid var(--line); border-radius:18px; padding:12px; min-height:150px; display:flex; flex-direction:column; gap:8px; cursor:pointer; color:#16163F; }
.bin h3{ font-size:18px; } .bin .hint{ font-size:13px; opacity:.85; }
.bin.over{ outline:4px dashed var(--line); outline-offset:3px; }
.bin .chip{ background:rgba(255,255,255,.85); color:#16163F; border-color:#16163F; font-size:14px; }

/* Curseurs */
.slider{ margin-top:16px; }
.slider label{ font-weight:700; display:block; }
.slider .val{ font-family:'Space Grotesk', Arial, sans-serif; font-size:40px; font-weight:700; color:var(--violet); }
input[type=range]{ width:100%; accent-color:var(--coral); height:30px; }
.reveal{ margin-top:8px; padding:10px 14px; border-radius:12px; border:2px solid var(--line); background:var(--soft); }

/* Constructeur de title */
.serp{ background:#FFFFFF; color:#202124; border:3px solid var(--line); border-radius:16px; padding:16px 18px; font-family:Arial, sans-serif; }
.serp .u{ color:#1E6B3A; font-size:14px; } .serp .ti{ color:#1A0DAB; font-size:20px; margin:4px 0; min-height:26px; } .serp .d{ color:#4D5156; font-size:14px; min-height:20px; }
.slot{ min-height:62px; border:3px dashed var(--line); border-radius:16px; padding:10px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.slot:empty::before{ content:"Touche des étiquettes pour composer ton titre"; color:var(--muted); }
.count{ font-weight:700; }
.choices{ display:flex; flex-direction:column; gap:10px; }
.choice{ text-align:left; border:3px solid var(--line); border-radius:14px; padding:12px 14px; background:var(--surface); cursor:pointer; }
.choice.sel{ background:var(--yellow); color:#16163F; }
.choice.ok{ background:var(--goodbg); border-color:var(--good); } .choice.ko{ background:var(--badbg); border-color:var(--bad); }

/* Chasse aux signaux */
.fake{ background:#FFFFFF; color:#202124; border:3px solid var(--line); border-radius:18px; padding:22px; font-family:Georgia, 'Times New Roman', serif; }
.fake .site{ font-family:Arial, sans-serif; font-size:13px; color:#666; border-bottom:1px solid #ddd; padding-bottom:8px; margin-bottom:12px; }
.fake h3{ font-family:Georgia, serif; font-size:24px; margin-bottom:10px; }
.spot{ cursor:pointer; border-bottom:2px dotted #8a8aa8; padding:1px 2px; border-radius:4px; }
.spot:hover{ background:#FFF3B8; }
.spot.mark{ background:#FFD23F; border-bottom-color:#16163F; }
.spot.ok{ background:#C9F2DD; } .spot.ko{ background:#F9C9BC; } .spot.miss{ outline:2px dashed #C8361A; }
.counter{ font-weight:700; }

/* Dilemmes */
.dil .opt{ margin-top:10px; }

/* Texte à trous */
.boss p{ font-size:19px; line-height:2.1; }
.boss select{ font:inherit; font-size:16px; padding:4px 8px; border:3px solid var(--line); border-radius:10px; background:var(--yellow); color:#16163F; max-width:100%; }
.boss select.ok{ background:var(--mint); } .boss select.ko{ background:var(--coral); }

/* Résultat */
.result{ margin-top:22px; }
.stars{ font-size:40px; letter-spacing:6px; color:var(--coral); }
.score-bar{ height:18px; border-radius:99px; border:3px solid var(--line); overflow:hidden; background:var(--soft); }
.score-fill{ height:100%; background:var(--mint); width:0; transition:width .7s; }
.fb{ margin:12px 0 0; padding-left:20px; } .fb li{ margin-bottom:6px; }
.retain{ margin-top:14px; border-left:8px solid var(--violet); padding:10px 14px; background:var(--soft); border-radius:10px; }

/* Certificat */
.cert{ text-align:center; padding:40px 24px; background:var(--yellow); color:#16163F; }
.cert h2{ font-size:clamp(30px,5vw,52px); }
.cert .name{ font-family:'Space Grotesk', Arial, sans-serif; font-size:clamp(28px,5vw,44px); font-weight:700; margin:12px 0; }
.badge{ display:inline-block; background:#16163F; color:#FFD23F; border-radius:99px; padding:8px 18px; font-weight:700; }

@media (max-width:760px){
  .hero{ grid-template-columns:1fr; } .bubbles{ max-width:280px; margin:0 auto; order:-1; }
  .map{ grid-template-columns:repeat(2,1fr); gap:18px; } .node:nth-child(even){ transform:translateY(24px); }
  .bins.b4{ grid-template-columns:repeat(2,1fr); } .bins.b2{ grid-template-columns:1fr; }
  .fiche{ grid-template-columns:1fr; } .link-zone{ gap:12px 14%; } .pill{ font-size:14px; padding:10px; }
  .xp-bar{ width:70px; }
}
@media print{ .top, .noprint{ display:none!important; } body{ background:#fff; } }

/* Histoire */
.top-actions{ display:flex; gap:8px; }
.top-actions button{ background:none; border:2px solid #FBF8F3; color:#FBF8F3; border-radius:99px; padding:4px 12px; cursor:pointer; font-size:14px; font-weight:600; }
.notice{ position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:20; max-width:min(560px,92vw); background:var(--yellow); color:#16163F; border:3px solid #16163F; border-radius:16px; box-shadow:5px 5px 0 #16163F; padding:12px 18px; font-weight:600; }
.when{ display:flex; flex-wrap:wrap; gap:8px; }
.when span{ font-weight:700; font-size:14px; border:2px solid var(--line); border-radius:99px; padding:4px 12px; background:var(--surface); }
.when span:first-child{ background:var(--violet); color:#FBF8F3; }
.kicker{ margin-top:18px; font-weight:700; color:var(--coral); font-size:16px; }
.after .kicker{ margin-top:0; }
.scene-title{ font-size:clamp(28px,5vw,46px); margin-top:6px; }
.dialog{ display:flex; flex-direction:column; gap:14px; margin-top:24px; max-width:760px; }
.line{ display:grid; grid-template-columns:64px 1fr; gap:14px; align-items:start; }
.line.me{ grid-template-columns:1fr 64px; } .line.me .avatar{ order:2; } .line.me .bubble{ background:var(--yellow); color:#16163F; }
.line.me .bubble .muted{ color:#4A4A6A; }
.bubble{ background:var(--surface); border:3px solid var(--line); border-radius:4px 20px 20px 20px; box-shadow:4px 4px 0 var(--shadow); padding:12px 16px; }
.line.me .bubble{ border-radius:20px 4px 20px 20px; }
.bubble .who{ font-weight:700; font-size:15px; margin-bottom:2px; } .bubble .who .muted{ font-weight:500; }
.line.narr{ display:block; }
.line.narr p{ font-style:italic; color:var(--muted); border-left:4px solid var(--coral); padding:4px 0 4px 14px; font-size:18px; }
@media (prefers-reduced-motion:no-preference){ .line{ animation:pop .35s ease-out; } @keyframes pop{ from{ opacity:0; transform:translateY(8px); } } }
.avatar{ font-size:16px; }
.story{ font-size:19px; line-height:1.55; }
.dash{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
.gauge{ border:3px solid var(--line); border-radius:16px; padding:12px 14px; background:var(--surface); display:flex; flex-direction:column; gap:8px; }
.g-top{ display:flex; justify-content:space-between; gap:8px; font-size:14px; font-weight:600; }
.g-bar{ height:14px; border-radius:99px; border:2px solid var(--line); overflow:hidden; background:var(--soft); }
.g-fill{ height:100%; transition:width 1s ease-out; }
.up{ color:var(--good); }
.gauge.pos{ background:var(--yellow); color:#16163F; font-size:14px; font-weight:600; justify-content:center; }
.gauge.pos b{ font-family:'Space Grotesk', Arial, sans-serif; font-size:26px; }
.gauge.pos .muted{ color:#4A4A6A; }
.small{ font-size:12px; }
.chap h3{ font-size:24px; } .chap .map{ grid-template-columns:repeat(3,1fr); }
.node .d{ font-size:13px; color:var(--muted); }
@media (max-width:760px){ .dash{ grid-template-columns:1fr 1fr; } .chap .map{ grid-template-columns:repeat(2,1fr); } .top-actions button span{ display:none; } }

/* Menu latéral */
.top-in{ max-width:1280px; }
.layout{ max-width:1280px; margin:0 auto; display:grid; grid-template-columns:272px minmax(0,1fr); }
.layout main{ max-width:960px; width:100%; }
.nav{ position:sticky; top:calc(64px + env(safe-area-inset-top,0px)); align-self:start; height:calc(100vh - 64px - env(safe-area-inset-top,0px)); overflow-y:auto; padding:16px 12px 32px; border-right:3px solid var(--line); background:var(--surface); }
.nav h4{ font-family:'DM Sans', Arial, sans-serif; font-size:13px; color:var(--muted); margin:18px 10px 6px; font-weight:700; }
.nav h4:first-child{ margin-top:4px; }
.nav-i{ display:flex; width:100%; align-items:center; gap:10px; padding:8px 10px; border-radius:12px; border:2px solid transparent; background:none; text-align:left; cursor:pointer; font-weight:600; font-size:15px; line-height:1.25; color:var(--text); }
.nav-i:hover{ background:var(--soft); }
.nav-i.active{ background:var(--yellow); color:#16163F; border-color:var(--line); box-shadow:3px 3px 0 var(--shadow); }
.nav-i[disabled]{ opacity:.5; cursor:not-allowed; background:none; }
.nav-i .ic{ width:26px; flex:none; text-align:center; font-size:17px; }
.nd{ width:26px; height:26px; flex:none; border-radius:50%; border:2px solid var(--line); display:grid; place-items:center; font-size:13px; font-weight:700; color:#16163F; }
.nst{ margin-left:auto; color:var(--coral); font-size:12px; letter-spacing:1px; white-space:nowrap; }
.nav-i.active .nst{ color:#16163F; }
.nav-progress{ margin:6px 10px 0; font-size:13px; color:var(--muted); }
.menu-btn{ display:none; background:none; border:2px solid #FBF8F3; color:#FBF8F3; border-radius:10px; width:40px; height:36px; font-size:20px; cursor:pointer; }
.scrim{ position:fixed; inset:0; background:rgba(10,10,30,.45); z-index:25; }
.tools-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
.tools-grid .card{ padding:18px; }
.tools-grid h3{ font-size:20px; margin-bottom:6px; }
.gl{ display:grid; grid-template-columns:220px 1fr; gap:10px 18px; }
.gl dt{ font-weight:700; } .gl dd{ margin:0; }
.cast{ display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
.cast .card{ display:grid; grid-template-columns:64px 1fr; gap:14px; align-items:start; padding:18px; }
@media (max-width:900px){
  .layout{ grid-template-columns:1fr; }
  .menu-btn{ display:inline-grid; place-items:center; }
  .nav{ position:fixed; z-index:30; left:0; top:0; bottom:0; height:auto; width:min(300px,86vw); padding-top:calc(18px + env(safe-area-inset-top,0px)); padding-bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-105%); transition:transform .25s ease; box-shadow:6px 0 0 var(--shadow); }
  .nav.open{ transform:none; }
  .tools-grid, .cast{ grid-template-columns:1fr; } .gl{ grid-template-columns:1fr; } .gl dd{ margin-bottom:8px; }
}
@media (prefers-reduced-motion:reduce){ .nav{ transition:none; } }
.support{ display:grid; grid-template-columns:64px 1fr; gap:16px; align-items:start; }
.sup-ic{ width:64px; height:64px; border-radius:18px; border:3px solid var(--line); background:var(--sky); display:grid; place-items:center; font-size:30px; }
a.btn{ text-decoration:none; }
@media (max-width:600px){ .support{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <button class="menu-btn noprint" id="menuBtn" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="nav">☰</button>
    <button class="logo" id="home" aria-label="Retour à l’accueil"><span class="logo-dot"></span>Pétillante</button>
    <div class="xp" aria-live="polite"><span id="xpTxt">0 XP</span><div class="xp-bar"><div class="xp-fill" id="xpFill"></div></div></div>
    <button class="theme-btn" id="theme" aria-label="Changer de thème">☾</button>
  </div>
</header>
<input type="file" id="draftFile" accept=".json,application/json" hidden>
<div class="layout">
  <nav id="nav" class="nav noprint" aria-label="Navigation du jeu"></nav>
  <main id="app"></main>
</div>
<div class="scrim" id="scrim" hidden></div>
<div id="notice" class="notice" role="status" hidden></div>
<script>
/* ---------- État et sauvegarde ---------- */
const KEY = 'operation-mousse-v2';
let S = { name:'', score:{}, prologue:false };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} updateXP(); }
const app = document.getElementById('app');
const totalXP = () => Object.values(S.score).reduce((a,b)=>a+b,0);
function updateXP(){ const x = totalXP(); document.getElementById('xpTxt').textContent = x + ' XP'; document.getElementById('xpFill').style.width = (x/10) + '%'; }
const stars = s => s>=90 ? 3 : s>=60 ? 2 : s>0 ? 1 : 0;
const starTxt = n => '★'.repeat(n) + '☆'.repeat(3-n);
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COLORS = ['var(--coral)','var(--yellow)','var(--mint)','var(--sky)','var(--violet)'];

/* Thème */
const themeBtn = document.getElementById('theme');
function applyTheme(t){ if (t) document.documentElement.setAttribute('data-theme', t); try{ localStorage.setItem(KEY+'-theme', t||''); }catch(e){} }
try { const t = localStorage.getItem(KEY+'-theme'); if (t) applyTheme(t); } catch(e) {}
themeBtn.onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  applyTheme(cur === 'dark' ? 'light' : 'dark');
};

/* ---------- Missions ---------- */
const M = [];

/* 1. Réordonner : pyramide inversée */
M.push({ title:'La pyramide inversée', format:'Remettre dans l’ordre', color:'var(--coral)',
  brief:'Inès a écrit le texte de la page « Atelier » dans le désordre. Remets les phrases dans l’ordre de la pyramide inversée : l’essentiel en haut, le contexte en bas.',
  render(el, done){
    const items = [
      { id:'a', t:'Fabriquez votre propre savon en 2 heures, dans notre atelier d’Annecy, dès 45 € par personne.' },
      { id:'b', t:'Vous repartez avec 4 savons, la recette et les bons gestes de la saponification à froid.' },
      { id:'c', t:'Les ateliers ont lieu le mercredi et le samedi, en groupe de 6 personnes maximum.' },
      { id:'d', t:'Tout le matériel est fourni, y compris les gants et les lunettes de protection.' },
      { id:'e', t:'Inès a fondé Bulles d’Ici en 2021, après une formation de savonnière.' },
    ];
    let order = shuffle(items);
    if (order[0].id === 'a' && order[4].id === 'e') order = [order[4], ...order.slice(1,4), order[0]];
    const ul = document.createElement('ol'); ul.className = 'order';
    const draw = () => {
      ul.innerHTML = '';
      order.forEach((it,i) => {
        const li = document.createElement('li'); li.dataset.id = it.id;
        li.innerHTML = `<span class="pos">${i+1}</span><span class="txt">${esc(it.t)}</span><span class="arrows"><button aria-label="Monter">▲</button><button aria-label="Descendre">▼</button></span>`;
        const [up, dn] = li.querySelectorAll('button');
        up.disabled = i===0; dn.disabled = i===order.length-1;
        up.onclick = () => { [order[i-1],order[i]]=[order[i],order[i-1]]; draw(); ul.children[i-1].querySelector('button').focus(); };
        dn.onclick = () => { [order[i+1],order[i]]=[order[i],order[i+1]]; draw(); ul.children[i+1].querySelectorAll('button')[1].focus(); };
        ul.appendChild(li);
      });
    };
    draw(); el.appendChild(ul);
    const b = button('Valider l’ordre', 'coral'); el.appendChild(wrap(b));
    b.onclick = () => {
      const ids = order.map(o=>o.id);
      const ok = [ids[0]==='a', ids[1]==='b', ['c','d'].includes(ids[2]), ['c','d'].includes(ids[3]), ids[4]==='e'];
      [...ul.children].forEach((li,i) => { li.classList.add(ok[i]?'ok':'ko'); li.querySelectorAll('button').forEach(x=>x.disabled=true); });
      b.disabled = true;
      const score = Math.round(ok.filter(Boolean).length/5*100);
      done(score, [
        'En haut : l’offre et son prix, ce que cherche l’internaute.',
        'Ensuite : le bénéfice (ce qu’on emporte), puis les infos pratiques (jours, groupe, matériel), dans l’ordre que tu préfères.',
        'En bas : l’histoire d’Inès. Elle est utile, mais pour la confiance, sur la page « Qui sommes-nous ».'
      ], 'Si le lecteur s’arrête après la première phrase, il doit avoir l’essentiel.');
    };
  }
});

/* 2. Swipe : Mythbusters */
M.push({ title:'Mythbusters SEO', format:'Trier des cartes', color:'var(--yellow)',
  brief:'Le neveu d’Inès « s’y connaît en SEO ». Il a laissé 8 conseils sur un post-it. Pour chaque carte : vrai ou faux ? Glisse la carte ou utilise les boutons.',
  render(el, done){
    const cards = [
      { q:'Un article doit faire au moins 1 500 mots pour se classer.', a:false, e:'Pour Google, il n’y a pas de longueur « magique ».' },
      { q:'Google ignore la balise meta « keywords ».', a:true, e:'Google indique ne pas l’utiliser.' },
      { q:'L’E-E-A-T est un score unique qui classe les pages.', a:false, e:'C’est un ensemble de signaux, pas un facteur de classement spécifique.' },
      { q:'On peut utiliser l’IA pour aider à rédiger.', a:true, e:'Oui, ce qui est sanctionné, c’est la production de masse pour manipuler le classement.' },
      { q:'Un fichier llms.txt est indispensable pour les Aperçus IA.', a:false, e:'Google indique ne pas l’utiliser pour sa recherche.' },
      { q:'La plupart des internautes balaient les pages plutôt que de les lire.', a:true, e:'C’est le motif de lecture en F de Nielsen Norman Group.' },
      { q:'Changer la date d’un article suffit à le rendre « frais ».', a:false, e:'Google cite cette pratique parmi celles à éviter.' },
      { q:'Un mot-clé dans le nom de domaine booste fortement le classement.', a:false, e:'Effet pratiquement nul, selon Google.' },
    ];
    let i = 0, good = 0; const log = [];
    const deck = document.createElement('div'); deck.className = 'deck';
    const flash = document.createElement('p'); flash.className = 'flash'; flash.setAttribute('aria-live','polite');
    const vf = document.createElement('div'); vf.className = 'vf';
    const bF = button('Faux','coral'), bV = button('Vrai','mint'); vf.append(bF, bV);
    const prog = document.createElement('p'); prog.className = 'muted'; prog.style.textAlign = 'center';
    el.append(prog, deck, vf, flash);
    const draw = () => {
      deck.innerHTML = '';
      prog.textContent = `Carte ${Math.min(i+1,cards.length)} sur ${cards.length}`;
      if (i+2 < cards.length) deck.appendChild(Object.assign(document.createElement('div'),{className:'card swipe behind2'}));
      if (i+1 < cards.length) deck.appendChild(Object.assign(document.createElement('div'),{className:'card swipe behind'}));
      const c = document.createElement('div'); c.className = 'card swipe'; c.innerHTML = `<p class="q">${esc(cards[i].q)}</p><p class="muted">← Faux   ·   Vrai →</p>`;
      deck.appendChild(c); enableSwipe(c);
    };
    const answer = v => {
      if (i >= cards.length) return;
      const c = cards[i], ok = v === c.a; if (ok) good++;
      log.push((ok?'✔ ':'✘ ') + c.q + ' → ' + (c.a?'Vrai':'Faux') + '. ' + c.e);
      flash.innerHTML = `<span style="color:${ok?'var(--good)':'var(--bad)'}">${ok?'Bien vu !':'Raté.'}</span> ${esc(c.e)}`;
      const top = deck.lastElementChild; top.classList.add(v?'fly-right':'fly-left');
      i++;
      setTimeout(() => {
        if (i < cards.length) draw();
        else { bF.disabled = bV.disabled = true; deck.innerHTML=''; prog.textContent=''; done(Math.round(good/cards.length*100), log, 'Avant de suivre un conseil SEO, cherche sa source : la documentation de Google Search Central d’abord.'); }
      }, 380);
    };
    function enableSwipe(c){
      let x0 = null, dx = 0;
      c.addEventListener('pointerdown', e => { x0 = e.clientX; c.setPointerCapture(e.pointerId); c.style.transition='none'; });
      c.addEventListener('pointermove', e => { if (x0===null) return; dx = e.clientX - x0; c.style.transform = `translateX(${dx}px) rotate(${dx/18}deg)`; });
      const end = () => { if (x0===null) return; x0 = null; c.style.transition='transform .2s'; if (Math.abs(dx) > 90) { c.style.transform=''; answer(dx > 0); } else c.style.transform=''; dx = 0; };
      c.addEventListener('pointerup', end); c.addEventListener('pointercancel', end);
    }
    bF.onclick = () => answer(false); bV.onclick = () => answer(true);
    el.tabIndex = -1;
    el.addEventListener('keydown', e => { if (e.key==='ArrowLeft') answer(false); if (e.key==='ArrowRight') answer(true); });
    draw();
  }
});

/* 3. Relier : éléments on-page */
M.push({ title:'L’anatomie d’une page', format:'Relier les éléments', color:'var(--mint)',
  brief:'Inès confond tous les termes techniques. Relie chaque élément de la page à son rôle : touche un élément à gauche, puis son rôle à droite.',
  render(el, done){
    const pairs = [
      ['Balise title','Le titre cliquable affiché dans les résultats'],
      ['Meta description','L’extrait qui donne envie de cliquer'],
      ['H1','Le titre visible en haut de la page'],
      ['Attribut alt','La description d’une image pour les moteurs et les lecteurs d’écran'],
      ['Ancre de lien','Le texte cliquable qui annonce la page de destination'],
      ['URL','L’adresse de la page, lisible et courte'],
    ];
    const zone = document.createElement('div'); zone.className = 'link-zone';
    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    const L = document.createElement('div'), R = document.createElement('div'); L.className = R.className = 'col';
    zone.append(svg, L, R); el.appendChild(zone);
    const links = {}; let sel = null;
    const left = pairs.map((p,i)=>{ const b = document.createElement('button'); b.className='pill'; b.textContent=p[0]; b.dataset.i=i; L.appendChild(b); return b; });
    const right = shuffle(pairs.map((p,i)=>({t:p[1],i}))).map(o=>{ const b = document.createElement('button'); b.className='pill'; b.textContent=o.t; b.dataset.i=o.i; R.appendChild(b); return b; });
    const col = i => ['#FF5B3A','#5B3FD9','#18865A','#E0A800','#2B8FD6','#C2185B'][i];
    function drawLines(){
      const z = zone.getBoundingClientRect(); svg.innerHTML = '';
      Object.entries(links).forEach(([li, ri]) => {
        const a = left[li].getBoundingClientRect(), b = right.find(x=>x.dataset.i==ri).getBoundingClientRect();
        const x1=a.right-z.left, y1=a.top+a.height/2-z.top, x2=b.left-z.left, y2=b.top+b.height/2-z.top;
        const p = document.createElementNS('http://www.w3.org/2000/svg','path');
        p.setAttribute('d',`M${x1},${y1} C${(x1+x2)/2},${y1} ${(x1+x2)/2},${y2} ${x2},${y2}`);
        p.setAttribute('stroke', col(+li)); p.setAttribute('stroke-width','5'); p.setAttribute('fill','none'); p.setAttribute('stroke-linecap','round');
        svg.appendChild(p);
      });
      left.forEach((b,i)=>b.classList.toggle('linked', i in links));
      right.forEach(b=>b.classList.toggle('linked', Object.values(links).includes(b.dataset.i)));
      v.disabled = Object.keys(links).length < pairs.length;
    }
    left.forEach((b,i)=> b.onclick = () => { if (locked) return; if (i in links){ delete links[i]; } left.forEach(x=>x.classList.remove('sel')); sel = i; b.classList.add('sel'); drawLines(); });
    right.forEach(b=> b.onclick = () => {
      if (locked || sel===null) return;
      for (const k in links) if (links[k]===b.dataset.i) delete links[k];
      links[sel] = b.dataset.i; left[sel].classList.remove('sel'); sel = null; drawLines();
    });
    let locked = false;
    const v = button('Valider les liens','mint'); el.appendChild(wrap(v)); v.disabled = true;
    addEventListener('resize', drawLines);
    v.onclick = () => {
      locked = true; v.disabled = true; let good = 0; const fb = [];
      left.forEach((b,i)=>{ const ok = links[i]==String(i); if (ok) good++; b.classList.add(ok?'ok':'ko'); if(!ok) fb.push(`${pairs[i][0]} : ${pairs[i][1].toLowerCase()}.`); });
      right.forEach(b=>{ const li = Object.keys(links).find(k=>links[k]===b.dataset.i); b.classList.add(li==b.dataset.i?'ok':'ko'); });
      if (!fb.length) fb.push('Tout est juste : tu parles déjà le langage du SEO on-page.');
      fb.push('Bon à savoir : Google peut réécrire le titre et l’extrait affichés à partir d’autres éléments de la page.');
      done(Math.round(good/pairs.length*100), fb, 'Title et meta servent d’abord à obtenir le clic : rédige-les comme une promesse tenue.');
    };
    requestAnimationFrame(drawLines);
  }
});

/* 4. Bacs : intentions de recherche */
M.push({ title:'Que veut l’internaute ?', format:'Glisser-déposer', color:'var(--sky)',
  brief:'Voici 10 requêtes tapées par de futurs clients. Classe chacune dans son intention dominante. Glisse les étiquettes, ou touche une étiquette puis un bac.',
  render(el, done){
    const Q = [
      ['bulles d’ici horaires','nav'], ['comment faire un savon à froid','info'], ['meilleur shampoing solide cheveux bouclés','com'],
      ['acheter savon surgras annecy','tra'], ['réserver atelier savon annecy','tra'], ['savon saponification à froid avis','com'],
      ['pourquoi mon savon ne mousse pas','info'], ['bulles d’ici boutique en ligne','nav'], ['shampoing solide ou liquide','com'], ['combien de temps sèche un savon','info'],
    ];
    const BINS = [ ['info','Information­nelle','apprendre, résoudre','var(--violet)'], ['nav','Navigation­nelle','aller sur un site précis','var(--mint)'], ['com','Commerciale','comparer avant d’acheter','var(--yellow)'], ['tra','Transaction­nelle','agir maintenant','var(--coral)'] ];
    const NAMES = { info:'informationnelle', nav:'navigationnelle', com:'commerciale', tra:'transactionnelle' };
    const { pool, bins, chips } = buildBins(el, Q.map(q=>q[0]), BINS, 'b4');
    bins.info.querySelector('h3').style.color = '#FBF8F3'; bins.info.querySelector('.hint').style.color = '#FBF8F3';
    const v = button('Valider le tri','coral'); el.appendChild(wrap(v));
    v.onclick = () => {
      if (pool.querySelector('.chip')) { toast(v, 'Place toutes les requêtes avant de valider.'); return; }
      let good = 0; const fb = [];
      chips.forEach((c,i)=>{ const where = c.parentElement.dataset.bin; const ok = where===Q[i][1]; if (ok) good++; c.classList.add(ok?'ok':'ko'); c.draggable=false; if(!ok) fb.push(`« ${Q[i][0]} » : intention ${NAMES[Q[i][1]]}.`); });
      v.disabled = true; lockBins(bins);
      if (!fb.length) fb.push('Sans faute : tu lis les requêtes comme Google.');
      fb.push('Indices à retenir : comment, pourquoi = information ; meilleur, avis, ou, vs = comparaison ; acheter, réserver, prix + ville = action ; nom de la marque = navigation.');
      done(Math.round(good/Q.length*100), fb, 'En cas de doute, tape la requête et observe ce que Google affiche déjà : c’est lui qui révèle l’intention.');
    };
  }
});

/* 5. Curseurs : chiffres clés */
M.push({ title:'Le juste chiffre', format:'Estimer avec un curseur', color:'var(--violet)',
  brief:'Inès se demande si Google vaut encore la peine, avec l’arrivée des IA. Estime ces trois chiffres vus en cours avec les curseurs.',
  render(el, done){
    const Q = [
      { l:'Part de Google dans les recherches en France (mai 2026)', a:88.69, max:100, src:'88,69 %, StatCounter, mai 2026.' },
      { l:'Part des visites avec un clic sur un résultat, quand un résumé IA s’affiche', a:8, max:50, src:'8 %, Pew Research Center, 2025.' },
      { l:'La même part, sans résumé IA', a:15, max:50, src:'15 %, Pew Research Center, 2025. Google conteste la méthode de cette étude.' },
    ];
    const inputs = Q.map(q=>{
      const d = document.createElement('div'); d.className = 'card slider';
      const mid = Math.round(q.max/2);
      d.innerHTML = `<label>${esc(q.l)}<span class="val" aria-hidden="true"> ${mid} %</span><input type="range" min="0" max="${q.max}" step="1" value="${mid}" aria-label="${esc(q.l)}"></label><div class="reveal" hidden></div>`;
      const r = d.querySelector('input'), val = d.querySelector('.val'); r.oninput = () => val.textContent = ' ' + r.value + ' %';
      el.appendChild(d); return d;
    });
    const v = button('Révéler les réponses','coral'); el.appendChild(wrap(v));
    v.onclick = () => {
      v.disabled = true; let pts = 0; const fb = [];
      inputs.forEach((d,i)=>{ const r = d.querySelector('input'); r.disabled = true; const diff = Math.abs(+r.value - Q[i].a); const s = Math.max(0, 1 - diff/15); pts += s;
        const rv = d.querySelector('.reveal'); rv.hidden = false; rv.innerHTML = `Réponse : <b>${esc(Q[i].src)}</b> Tu étais à ${Math.round(diff)} point${diff>=2?'s':''} près.`; });
      fb.push('Google reste incontournable en France, mais les résumés IA réduisent les clics sur les questions simples.');
      fb.push('Les chiffres sur les résumés IA viennent de données américaines, et Google les conteste : cite toujours la source, la date et la méthode.');
      done(Math.round(pts/Q.length*100), fb, 'Le contenu générique est le plus exposé au « zéro clic » ; l’expérience et le local résistent mieux.');
    };
  }
});

/* 6. Constructeur : title et meta */
M.push({ title:'Le title parfait', format:'Composer un titre', color:'var(--coral)',
  brief:'Compose la balise title de la page « Savon surgras » en touchant les étiquettes dans l’ordre, puis choisis la meilleure meta description. L’aperçu Google se met à jour en direct.',
  render(el, done){
    const CH = ['Savon surgras','artisanal','à Annecy','| Bulles d’Ici','Accueil','savon savon pas cher','Le meilleur savon du monde','– Bienvenue sur notre site'];
    const BAD = ['Accueil','savon savon pas cher','Le meilleur savon du monde','– Bienvenue sur notre site'];
    const METAS = [
      { t:'Bienvenue sur le site de Bulles d’Ici, une savonnerie.', ok:false, why:'générique, elle ne dit rien du produit' },
      { t:'Savon Annecy savon artisanal savon bio savon pas cher savon Annecy.', ok:false, why:'bourrage de mots-clés, contraire aux règles anti-spam' },
      { t:'Savons surgras fabriqués à la main à Annecy, saponifiés à froid. Livraison en 48 h ou retrait à l’atelier.', ok:true, why:'précise, utile, elle donne envie de cliquer' },
    ];
    let title = [], meta = null;
    el.insertAdjacentHTML('beforeend', `<div class="serp" aria-live="polite"><div class="u">bullesdici.fr › savons › savon-surgras</div><div class="ti"></div><div class="d"></div></div>
      <p class="mt"><b>Ton titre</b> <span class="count muted"></span></p><div class="slot"></div><p class="mt"><b>Étiquettes</b></p><div class="pool"></div>
      <p class="mt"><b>Meta description</b></p><div class="choices"></div>`);
    const ti = el.querySelector('.ti'), d = el.querySelector('.d'), slot = el.querySelector('.slot'), pool = el.querySelector('.pool'), choices = el.querySelector('.choices'), count = el.querySelector('.count');
    let locked = false;
    const draw = () => {
      slot.innerHTML = ''; pool.innerHTML = '';
      title.forEach((t,i)=>{ const c = chipBtn(t); c.onclick = () => { if(locked) return; title.splice(i,1); draw(); }; slot.appendChild(c); });
      CH.filter(t=>!title.includes(t)).forEach(t=>{ const c = chipBtn(t); c.onclick = () => { if(locked) return; title.push(t); draw(); }; pool.appendChild(c); });
      const str = title.join(' '); ti.textContent = str || 'Ton titre apparaîtra ici';
      count.textContent = `(${str.length} caractères)`;
      d.textContent = meta!==null ? METAS[meta].t : 'Choisis une meta description ci-dessous.';
    };
    shuffle(METAS.map((m,i)=>i)).forEach(i=>{ const b = document.createElement('button'); b.className='choice'; b.textContent = METAS[i].t; b.dataset.i=i;
      b.onclick = () => { if(locked) return; meta = i; choices.querySelectorAll('.choice').forEach(x=>x.classList.toggle('sel', x===b)); draw(); }; choices.appendChild(b); });
    draw();
    const v = button('Publier la page','coral'); el.appendChild(wrap(v));
    v.onclick = () => {
      if (!title.length || meta===null) { toast(v,'Compose un titre et choisis une meta avant de publier.'); return; }
      locked = true; v.disabled = true;
      const str = title.join(' ');
      const rules = [
        [title[0]==='Savon surgras', 'Le sujet principal ouvre le titre'],
        [title.includes('à Annecy'), 'La localisation est présente (requête locale)'],
        [title[title.length-1]==='| Bulles d’Ici', 'La marque est à la fin'],
        [!title.some(t=>BAD.includes(t)), 'Aucun mot parasite : ni « Accueil », ni superlatif, ni répétition'],
        [str.length<=60, 'Le titre reste court (repère de praticien : environ 60 caractères, la troncature dépend de la largeur affichée)'],
      ];
      let s = rules.filter(r=>r[0]).length*14;
      const m = METAS[meta]; if (m.ok) s += 30;
      choices.querySelectorAll('.choice').forEach(b=>{ const mm = METAS[b.dataset.i]; if (mm.ok) b.classList.add('ok'); else if (+b.dataset.i===meta) b.classList.add('ko'); });
      const fb = rules.map(r=>(r[0]?'✔ ':'✘ ')+r[1]+'.');
      fb.push((m.ok?'✔ ':'✘ ') + 'Meta description : ' + (m.ok? 'la bonne, ' : 'pas celle-ci, ') + m.why + '.');
      if (!m.ok) fb.push('La meilleure : « ' + METAS[2].t + ' »');
      done(Math.min(100,s), fb, 'Une page = un sujet = une intention. Exemple attendu : « Savon surgras artisanal à Annecy | Bulles d’Ici ».');

/* ---------- Outils d’interface ---------- */
function button(t, cls){ const b = document.createElement('button'); b.className = 'btn ' + (cls||''); b.textContent = t; return b; }
function wrap(b){ const d = document.createElement('div'); d.className = 'row mt'; d.appendChild(b); return d; }
function chipBtn(t){ const c = document.createElement('button'); c.className='chip'; c.textContent=t; return c; }
function toast(anchor, msg){ let t = anchor.parentElement.querySelector('.tst'); if(!t){ t = document.createElement('span'); t.className='tst muted'; t.setAttribute('role','status'); anchor.parentElement.appendChild(t); } t.textContent = msg; }
function lockBins(bins){ Object.values(bins).forEach(b=>{ b.onclick=null; b.ondrop=null; }); }
function buildBins(el, labels, BINS, cls){
  const pool = document.createElement('div'); pool.className = 'pool'; pool.dataset.bin = '';
  const grid = document.createElement('div'); grid.className = 'bins ' + cls;
  const bins = {}; let sel = null;
  const chips = labels.map((t,i)=>{ const c = chipBtn(t); c.draggable = true; c.dataset.i = i;
    c.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', i); });
    c.onclick = e => { e.stopPropagation(); if (c.classList.contains('ok')||c.classList.contains('ko')) return;
      if (sel && sel!==c && c.parentElement !== sel.parentElement) { c.parentElement.appendChild(sel); sel.classList.remove('sel'); sel = null; return; }
      chips.forEach(x=>x.classList.remove('sel')); sel = (sel===c) ? null : c; if (sel) c.classList.add('sel'); };
    return c; });
  shuffle(chips).forEach(c=>pool.appendChild(c));
  const target = (zone) => {
    zone.onclick = () => { if (sel){ zone.appendChild(sel); sel.classList.remove('sel'); sel = null; } };
    zone.addEventListener('dragover', e=>{ e.preventDefault(); zone.classList.add('over'); });
    zone.addEventListener('dragleave', ()=>zone.classList.remove('over'));
    zone.ondrop = e => { e.preventDefault(); zone.classList.remove('over'); const c = chips[+e.dataTransfer.getData('text/plain')]; if (c) zone.appendChild(c); };
  };
  BINS.forEach(([id,name,hint,color])=>{ const b = document.createElement('div'); b.className='bin'; b.dataset.bin = id; b.style.background = color;
    b.innerHTML = `<h3>${name}</h3><p class="hint">${hint}</p>`; target(b); grid.appendChild(b); bins[id] = b; });
  target(pool);
  el.append(pool, grid);
  return { pool, bins, chips };
}

/* Tableau de bord : poids de chaque mission sur les indicateurs */
const W = { vis:[0,1,1,2,1,2,0,2,0,1], conf:[1,0,0,0,0,0,3,1,3,1], resa:[2,0,0,2,0,2,0,1,0,2] };
function metric(k){ const w = W[k]; const tot = w.reduce((a,b)=>a+b,0); return Math.round(w.reduce((a,x,i)=>a + x*(S.score[i]||0), 0) / tot); }
function googlePos(){ return Math.max(1, Math.round(38 - metric('vis')*0.37)); }
function dashHTML(prev){
  const items = [['vis','Visibilité Google','var(--violet)'],['conf','Confiance','var(--mint)'],['resa','Réservations d’ateliers','var(--coral)']];
  return `<div class="dash">${items.map(([k,l,c])=>{ const v = metric(k), p = prev ? prev[k] : v;
    return `<div class="gauge"><div class="g-top"><span>${l}</span><b>${v} %${prev && v>p ? ` <span class="up">+${v-p}</span>`:''}</b></div>
      <div class="g-bar"><div class="g-fill" style="width:${p}%;background:${c}" data-to="${v}"></div></div></div>`; }).join('')}
    <div class="gauge pos"><span>« atelier savon annecy »</span><b>${googlePos()}<sup>${googlePos()===1?'re':'e'}</sup> position</b><span class="muted small">simulation</span></div></div>`;
}
function animateDash(root){ requestAnimationFrame(()=>requestAnimationFrame(()=> root.querySelectorAll('.g-fill').forEach(f=>f.style.width = f.dataset.to + '%'))); }

/* ---------- Sauvegarde du brouillon ---------- */
function downloadDraft(){
  const data = { app:'operation-mousse', version:2, name:S.name, score:S.score, prologue:!!S.prologue, savedAt:new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  const slug = (S.name||'stagiaire').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/gi,'-').toLowerCase();
  a.href = URL.createObjectURL(blob); a.download = `operation-mousse-brouillon-${slug}-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  notify('Brouillon téléchargé. Garde ce fichier pour reprendre plus tard.');
}
function restoreDraft(file){
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (d.app !== 'operation-mousse' || typeof d.score !== 'object') throw new Error();
      const sc = {}; Object.entries(d.score).forEach(([k,v])=>{ const i = +k, n = +v; if (i>=0 && i<10 && n>=0 && n<=100) sc[i] = Math.round(n); });
      S.name = String(d.name||'Stagiaire').slice(0,30); S.score = sc; S.prologue = true; save();
      notify(`Brouillon restauré : ${S.name}, ${Object.keys(sc).length} mission${Object.keys(sc).length>1?'s':''} jouée${Object.keys(sc).length>1?'s':''}.`);
      showMap();
    } catch(e) { notify('Ce fichier n’est pas un brouillon d’Opération Mousse. Choisis le fichier .json téléchargé depuis le jeu.'); }
  };
  r.readAsText(file);
}
function notify(msg){
  const n = document.getElementById('notice'); n.textContent = msg; n.hidden = false;
  clearTimeout(notify.t); notify.t = setTimeout(()=> n.hidden = true, 5000);
}

/* ---------- Scènes ---------- */
function avatar(who, size){ const c = CAST[who]; return `<div class="avatar ${size||''}" style="background:${c.bg};color:${c.fg}" aria-hidden="true">${c.n}</div>`; }
function playScene(scene, opts){
  const { kicker, title, cta, onDone } = opts;
  app.innerHTML = `
  <div class="scene">
    <p class="when"><span>${esc(scene.when)}</span><span>${esc(scene.place)}</span></p>
    ${kicker ? `<p class="kicker">${esc(kicker)}</p>` : ''}
    ${title ? `<h2 class="scene-title">${esc(title)}</h2>` : ''}
    <div class="dialog" aria-live="polite"></div>
    <div class="row mt2 noprint"><button class="btn" id="nextLine">Suite</button><button class="btn ghost" id="allLines">Tout afficher</button></div>
  </div>`;
  const dlg = app.querySelector('.dialog'), nx = document.getElementById('nextLine'), all = document.getElementById('allLines');
  let k = 0;
  const show = () => {
    const [who, txt] = scene.lines[k++];
    const el = document.createElement('div');
    if (who === 'narr') { el.className = 'line narr'; el.innerHTML = `<p>${esc(txt)}</p>`; }
    else { const c = CAST[who]; el.className = 'line' + (who==='you' ? ' me' : ''); el.innerHTML = `${avatar(who)}<div class="bubble"><p class="who">${c.n} <span class="muted">${esc(c.r)}</span></p><p>${esc(txt)}</p></div>`; }
    dlg.appendChild(el);
    if (k >= scene.lines.length) finish();
  };
  const finish = () => { nx.textContent = cta; nx.classList.add('coral'); all.remove(); nx.onclick = onDone; nx.focus(); };
  nx.onclick = show; all.onclick = () => { while (k < scene.lines.length) show(); };
  show(); scrollTo(0,0);
}

function toolHead(t, sub){ return `<p class="kicker" style="margin-top:0">Outils</p><h2 style="font-size:clamp(28px,5vw,40px)">${t}</h2>${sub?`<p class="muted mt" style="margin-top:8px">${sub}</p>`:''}`; }
function showClient(){
  app.innerHTML = `${toolHead('Fiche client et tableau de bord','Où en est Bulles d’Ici, mission après mission.')}
  <div class="card mt2">${dashHTML()}</div>
  <div class="card mt2"><h3 style="font-size:22px">Bulles d’Ici</h3>
    <div class="fiche mt">
      <div style="background:var(--coral)"><b>Qui</b><br>Savonnerie artisanale fictive de la vieille ville d’Annecy, créée en 2021 par Inès, savonnière formée.</div>
      <div style="background:var(--yellow)"><b>Quoi</b><br>Savons saponifiés à froid, shampoings solides, ateliers « fabrique ton savon », boutique en ligne.</div>
      <div style="background:var(--mint)"><b>Le rival</b><br>Mousse Express, site de bons plans généraliste aux promesses douteuses.</div>
    </div>
    <p class="muted mt">Les indicateurs et la position sont simulés à partir de tes scores : chaque mission pèse sur la visibilité, la confiance ou les réservations.</p></div>`;

}
function showCast(){
  const D = { max:'Ta tutrice. Exigeante, bienveillante, elle ne jure que par les sources officielles.', ines:'Ta cliente. Savonnière passionnée, excellente artisane, perdue face au jargon du web.', leo:'Le neveu d’Inès. Il a « lu sur un forum ». Ses conseils sont à vérifier, toujours.', sami:'La stagiaire d’Inès. Pleine d’idées, un peu trop pressée de tout confier à l’IA.', camille:'L’associée d’Inès. Elle tient les comptes et veut des preuves chiffrées.', you:'Stagiaire chez Pétillante. Une semaine pour faire passer Bulles d’Ici devant Mousse Express.' };
  app.innerHTML = `${toolHead('Les personnages','Qui est qui dans l’Opération Mousse.')}
  <div class="cast mt2">${Object.keys(CAST).map(k=>`<div class="card">${avatar(k)}<div><h3 style="font-size:20px">${k==='you'?esc(S.name||'Toi'):CAST[k].n}</h3><p class="muted" style="font-size:14px">${esc(CAST[k].r)}</p><p class="mt" style="margin-top:8px">${esc(D[k])}</p></div></div>`).join('')}</div>`;

function showMemo(){
  app.innerHTML = `${toolHead('Aide-mémoire du cours','Les règles à avoir en tête avant chaque mission.')}
  <div class="tools-grid mt2">${MEMO.map((m,i)=>`<div class="card" style="border-top:10px solid ${COLORS[i%COLORS.length]}"><h3>${esc(m[0])}</h3><p>${esc(m[1])}</p></div>`).join('')}</div>`;
  scrollTo(0,0);
}
function showGloss(){
  app.innerHTML = `${toolHead('Glossaire','Le vocabulaire du cours, en une phrase par terme.')}
  <div class="card mt2"><dl class="gl">${GLOSS.map(g=>`<dt>${esc(g[0])}</dt><dd>${esc(g[1])}</dd>`).join('')}</dl></div>`;

}
function showPrologue(){ playScene(PROLOGUE, { kicker:'Prologue', title:'Premier jour chez Pétillante', cta: S.prologue ? 'Retour au planning' : 'Découvrir la cliente', onDone: S.prologue ? showMap : showBrief }); }


/* ---------- Support de cours ---------- */
const SUPPORT = {
  folder:'https://drive.google.com/drive/folders/1RyYVprx79oa-eNCJIQvNmnobxs66KlDs?usp=sharing',
  deck:'https://drive.google.com/file/d/1EZp6zqYJ7V619J0OHysHM0wfvB3Cu7f8/view?usp=sharing',
};
function supportCard(title, sub){

    <div class="sup-ic" aria-hidden="true">📚</div>
    <div><h3 style="font-size:22px">${title}</h3><p class="mt" style="margin-top:6px">${sub}</p>

/* ---------- Menu latéral ---------- */
let ACTIVE = 'intro';
const nav = document.getElementById('nav'), scrim = document.getElementById('scrim'), menuBtn = document.getElementById('menuBtn');
function openNav(o){ nav.classList.toggle('open', o); scrim.hidden = !o; menuBtn.setAttribute('aria-expanded', o); }
menuBtn.onclick = () => openNav(!nav.classList.contains('open'));
scrim.onclick = () => openNav(false);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && nav.classList.contains('open')) { openNav(false); menuBtn.focus(); } });
function item(key, label, icon, opts){ opts = opts || {};
  return `<button class="nav-i ${ACTIVE===key?'active':''}" data-k="${key}" ${opts.dis?'disabled':''} ${ACTIVE===key?'aria-current="page"':''}>${icon}<span>${label}</span>${opts.end||''}</button>`; }
const ic = c => `<span class="ic" aria-hidden="true">${c}</span>`;
function renderNav(){
  if (!S.name) {
    nav.innerHTML = `<h4>Bienvenue</h4>${item('intro','Accueil',ic('🫧'))}${item('load','Reprendre un brouillon',ic('📂'))}${item('support','Support de cours',ic('📚'))}${item('memo','Aide-mémoire du cours',ic('📌'))}${item('gloss','Glossaire',ic('📖'))}`;
  } else {
    const done = Object.keys(S.score).length;
    let h = `<h4>Le stage</h4>${item('intro','Accueil',ic('🫧'))}${item('map','Planning de la semaine',ic('🗓️'))}${item('prologue','Prologue',ic('🎬'))}`;
    h += `<p class="nav-progress">${done} mission${done>1?'s':''} sur 10 · ${totalXP()} XP</p>`;
    CHAPTERS.forEach(c => {
      h += `<h4>${esc(c.t)}</h4>`;
      for (let i=c.from; i<=c.to; i++){ const m = M[i], lock = !unlocked(i), sc = S.score[i];
        h += item('m'+i, esc(m.title), `<span class="nd" style="background:${lock?'var(--soft)':m.color};${m.color==='var(--violet)'&&!lock?'color:#FBF8F3':''}">${lock?'🔒':i+1}</span>`, { dis:lock, end: sc!==undefined?`<span class="nst" aria-label="${stars(sc)} étoiles">${starTxt(stars(sc))}</span>`:'' }); }
    });
    h += item('epi','Épilogue',ic('🌅'),{ dis: done<10 });
    h += `<h4>Outils</h4>${item('support','Support de cours',ic('📚'))}${item('client','Fiche client et tableau de bord',ic('📊'))}${item('cast','Personnages',ic('👥'))}${item('memo','Aide-mémoire du cours',ic('📌'))}${item('gloss','Glossaire',ic('📖'))}`;
    h += `<h4>Ma progression</h4>${item('save','Télécharger mon brouillon',ic('💾'))}${item('load','Restaurer un brouillon',ic('📂'))}${item('cert','Mon certificat',ic('🏅'),{ dis: done<10 })}${item('theme','Changer de thème',ic('🌓'))}${item('reset','Recommencer à zéro',ic('↺'))}`;
    nav.innerHTML = h;
  }
  nav.querySelectorAll('.nav-i').forEach(b => b.onclick = () => go(b.dataset.k));
}
function go(k){
  const close = !['save','load','theme'].includes(k);
  if (k==='intro') showIntro(); else if (k==='map') showMap(); else if (k==='prologue') showPrologue();
  else if (k[0]==='m' && /^m\d+$/.test(k)) startMission(+k.slice(1));
  else if (k==='epi') showEpilogue(); else if (k==='client') showClient(); else if (k==='cast') showCast();
  else if (k==='memo') showMemo(); else if (k==='support') showSupport(); else if (k==='gloss') showGloss(); else if (k==='cert') showCert();
  else if (k==='save') downloadDraft(); else if (k==='load') document.getElementById('draftFile').click();
  else if (k==='theme') document.getElementById('theme').click();
  else if (k==='reset') { if (confirm('Effacer ta progression et recommencer ? Pense à télécharger ton brouillon avant.')) { S.score = {}; S.prologue = false; S.name=''; save(); showIntro(); } }
  if (close) openNav(false);
}
function setActive(k){ ACTIVE = k; renderNav(); }
const withNav = (fn, key) => function(...a){ const r = fn.apply(this, a); setActive(typeof key==='function' ? key(...a) : key); return r; };
showIntro = withNav(showIntro,'intro'); showBrief = withNav(showBrief,'client'); showMap = withNav(showMap,'map');
startMission = withNav(startMission, i=>'m'+i); showMission = withNav(showMission, i=>'m'+i);
showEpilogue = withNav(showEpilogue,'epi'); showCert = withNav(showCert,'cert'); showClient = withNav(showClient,'client');
showCast = withNav(showCast,'cast'); showMemo = withNav(showMemo,'memo'); showGloss = withNav(showGloss,'gloss'); showPrologue = withNav(showPrologue,'prologue'); showSupport = withNav(showSupport,'support');
const _save = save; save = function(){ _save(); renderNav(); };

document.getElementById('home').onclick = () => showIntro();
document.getElementById('draftFile').onchange = e => { const f = e.target.files[0]; if (f) restoreDraft(f); e.target.value = ''; };
updateXP();
renderNav();
showIntro();
</script>
