<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Revue — La fiction, un « mentir-vrai »</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Caveat:wght@500;700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1F3A5F; --ink2:#2C4E7A; --paper:#EFE8DA; --sheet:#FFFDF7; --line:#DDD3C1; --lead:#5E5A52;
  --red:#C8242F; --hl:#FFD95A; --teal:#2A9D8F; --ochre:#D08C2E; --plum:#7A5BA6; --kraft:#C9A27A;
  --ok:#2E7D4F; --okbg:#E5F2E8; --kobg:#FBE7E4; --midbg:#FFF4D2;
  --display:"Fraunces", Georgia, serif; --serif:"Literata", Georgia, "Times New Roman", serif;
  --hand:"Caveat", "Segoe Print", "Comic Sans MS", cursive; --sans:"Archivo", "Segoe UI", Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;color:#24211C;font-family:var(--sans);font-size:16px;line-height:1.5}
body{background-color:var(--paper);background-image:radial-gradient(rgba(120,95,60,.07) 1px,transparent 1.2px),radial-gradient(rgba(120,95,60,.05) 1px,transparent 1.2px);background-size:22px 22px,13px 13px;background-position:0 0,7px 9px}
button{font-family:var(--sans);font-size:15px;cursor:pointer}
button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible, [tabindex]:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.hidden{display:none !important}
.pt{display:block;flex:none;border-radius:50%;box-shadow:0 0 0 2px #fff,0 2px 6px rgba(60,40,20,.18)}

/* ---------- BOOT ---------- */
#boot{min-height:100vh;display:grid;grid-template-columns:minmax(300px,480px) minmax(320px,470px);gap:56px;align-items:center;justify-content:center;padding:40px 24px}
.cover{background:var(--ink);color:#fff;padding:30px 30px 24px;aspect-ratio:3/4;display:flex;flex-direction:column;position:relative;transform:rotate(-1.5deg);box-shadow:14px 16px 0 rgba(31,58,95,.18),0 20px 40px rgba(40,30,15,.25)}
.mastc{font-family:var(--display);font-weight:900;font-size:68px;letter-spacing:-1.5px;line-height:.95;border-bottom:3px double rgba(255,255,255,.6);padding-bottom:10px}
.cover .num{display:flex;justify-content:space-between;font-size:13px;margin-top:8px;opacity:.9}
.coverart{display:flex;gap:10px;margin:26px 0 0;flex-wrap:wrap}
.cover .big{font-family:var(--display);font-weight:700;font-size:42px;line-height:1.05;margin-top:auto}
.cover .big .proof{position:relative;white-space:nowrap;background:linear-gradient(transparent 58%,rgba(255,217,90,.55) 58%)}
.cover .big .proof::after{content:"";position:absolute;left:-4px;right:-4px;top:50%;height:3px;background:var(--red);transform:rotate(-4deg)}
.cover .mark{font-family:var(--hand);color:#ffb8c0;font-size:28px;transform:rotate(-3deg);margin-top:2px}
.cover .foot{font-size:12px;opacity:.8;margin-top:16px;border-top:1px solid rgba(255,255,255,.35);padding-top:8px}
.bootform{background:var(--sheet);padding:30px 30px 24px;position:relative;box-shadow:0 10px 30px rgba(60,40,20,.15);transform:rotate(.6deg);max-width:470px;width:100%}
.bootform h1{font-family:var(--display);font-size:32px;line-height:1.1;margin:0 0 10px;color:var(--ink)}
.bootform p{color:var(--lead);margin:0 0 12px;font-family:var(--serif)}
.bootform p.hand{font-family:var(--hand);font-size:22px;line-height:1.2;color:var(--red)}
.tape{position:absolute;top:-12px;left:50%;width:110px;height:26px;transform:translateX(-50%) rotate(-2deg);background:rgba(255,236,170,.75);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.field{display:flex;flex-direction:column;margin-bottom:12px}
.field label{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:4px}
.field input{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:4px;background:#fff;width:100%}
.btn{background:var(--ink);color:#fff;border:0;border-radius:4px;padding:11px 18px;font-weight:600;box-shadow:0 3px 0 #13263f}
.btn:hover{background:var(--ink2)} .btn:active{transform:translateY(2px);box-shadow:0 1px 0 #13263f}
.btn.ghost{background:var(--sheet);color:var(--ink);border:1.5px solid var(--ink);box-shadow:none}
.btn.red{background:var(--red);box-shadow:0 3px 0 #8e1820}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.linkbtn{background:none;border:0;color:var(--ink);text-decoration:underline;padding:0;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}

/* ---------- APP / SIDEBAR ---------- */
#app{display:grid;grid-template-columns:282px 1fr;min-height:100vh}
#side{background:#2A2622;color:#EDE6D8;padding:18px 16px;position:sticky;top:0;height:100vh;overflow:auto;font-size:14px}
.press{background:var(--sheet);color:#24211C;border-radius:6px;padding:10px 12px 10px 14px;border-left:6px solid var(--red);position:relative}
.press b{display:block;font-family:var(--display);font-size:18px;color:var(--ink)} .press span{font-size:12px;color:var(--lead)}
.presst{font-size:11px;font-weight:700;color:var(--red);letter-spacing:.5px}
.sec{margin:18px 0 8px;font-family:var(--hand);font-size:22px;color:var(--hl);line-height:1}
.cdf{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.pg{aspect-ratio:3/4;border:1px solid #6b635a;background:#3a352f;color:#9c9389;border-radius:2px;font-size:11px;font-weight:700;padding:0;position:relative}
.pg span{position:relative;z-index:1}
.pg.done{background:var(--sheet);color:var(--ink);border-color:var(--sheet)}
.pg.done::before{content:"";position:absolute;left:3px;right:3px;top:4px;height:55%;background:repeating-linear-gradient(#cfc5b3 0 1px,transparent 1px 4px)}
.pg.ok{background:var(--sheet);color:var(--ink);border:1.5px dashed var(--hl)}
.pg.cur{background:var(--hl);color:#24211C;border-color:var(--hl);transform:scale(1.08);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.pg.une{background:var(--red);color:#fff;border-color:var(--red)}
.pg[disabled]{cursor:not-allowed;opacity:.6}
.cdfcur{font-size:12px;color:#cfc6b6;margin-top:6px;font-style:italic}
.gauge{margin-bottom:9px}
.gauge .lab{display:flex;justify-content:space-between;font-size:13px}
.gauge .bar{height:9px;background:#45403a;border-radius:5px;overflow:hidden;margin-top:3px}
.gauge .bar i{display:block;height:100%;border-radius:5px;transition:width .5s}
.gF .bar i{background:var(--teal)} .gA .bar i{background:#7FA6D6} .gC .bar i{background:var(--ochre)} .gP .bar i{background:#B59BD8}
.gauge.flash .bar i{background:var(--hl)}
.trust{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tr{display:flex;gap:8px;align-items:center}
.trn{font-size:13px;font-weight:600}
.dots{display:flex;gap:3px;margin-top:2px}
.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid #8c8378;display:block}
.dots i.on{background:var(--hl);border-color:var(--hl)}
.toks{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.tok{width:18px;height:18px;border-radius:50%;border:2px dashed #6b635a}
.tok.on{border:2px solid #b8860b;background:radial-gradient(circle at 35% 35%,#ffe9a0,#d4a72c)}
.tokn{font-size:12px;color:#cfc6b6;margin-left:4px}
.sidebtns{display:flex;flex-direction:column;gap:6px}
.sidebtns button{text-align:left;background:#3a352f;color:#EDE6D8;border:1px solid #57504a;border-radius:4px;padding:7px 10px;font-size:13px}
.sidebtns button:hover{border-color:var(--hl)}
.savestate{font-size:12px;color:#bfb6a7;margin-top:6px}

/* ---------- MAIN ---------- */
#main{padding:18px clamp(16px,4vw,52px) 90px;max-width:1100px}
.masthead{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:3px double var(--ink);padding-bottom:8px;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:900;font-size:34px;color:var(--ink);line-height:1;letter-spacing:-.5px}
.mhsub{font-size:12px;color:var(--lead);margin-top:2px}
.mh2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ab{display:flex;align-items:baseline;gap:8px;background:#24211C;color:#fff;border-radius:4px;padding:6px 12px}
.abl{font-size:11px;color:#cfc6b6} .abn{font-family:var(--display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.abd{font-size:12px;font-weight:700} .abd.p{color:#8fd4a3} .abd.n{color:#ff9b93}
.ab.up{animation:pulseUp 1s} .ab.down{animation:pulseDown 1s}
@keyframes pulseUp{30%{background:var(--ok)}} @keyframes pulseDown{30%{background:var(--red)}}
.mhb{background:var(--sheet);border:1.5px solid var(--ink);color:var(--ink);border-radius:4px;padding:7px 12px;font-weight:600;font-size:14px}
.mhb:hover{background:var(--hl)}
.rubrique{display:inline-block;margin:16px 0 4px;background:var(--red);color:#fff;font-weight:700;font-size:13px;padding:3px 10px;transform:rotate(-1deg)}
.steptitle{font-family:var(--display);font-weight:900;font-size:clamp(30px,4vw,44px);line-height:1.05;color:var(--ink);margin:6px 0 4px;letter-spacing:-.5px}
.lieu{font-family:var(--serif);font-style:italic;color:var(--lead);margin-bottom:20px}
.lieu::before{content:"— "}

/* dialogue */
.scene{display:flex;flex-direction:column;gap:12px;margin-bottom:24px;max-width:860px}
.line{display:flex;gap:12px;align-items:flex-start}
.line .bub{position:relative;background:var(--sheet);border-radius:4px 16px 16px 16px;padding:10px 15px 11px;font-family:var(--serif);font-size:16.5px;box-shadow:0 2px 0 rgba(60,40,20,.08),0 6px 16px rgba(60,40,20,.07);border-top:3px solid var(--c)}
.line .bub b{font-family:var(--sans);font-size:13px;display:block;color:var(--c);margin-bottom:1px}
.line .bub b span{font-weight:500;color:var(--lead);font-size:12px;margin-left:4px}
.line.narr .bub{background:transparent;box-shadow:none;border:0;border-left:3px solid var(--kraft);border-radius:0;font-style:italic;color:#4a453d;padding:2px 0 2px 14px;font-size:17px}
.scene.anim .line{animation:rise .45s both;animation-delay:calc(var(--i)*140ms)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* panels */
.panel{background:var(--sheet);border-radius:3px;padding:24px 24px 20px;margin:26px 0 18px;position:relative;box-shadow:0 1px 0 rgba(60,40,20,.08),0 10px 26px rgba(60,40,20,.10)}
.panel>.tape{left:40px;transform:rotate(-3deg)}
.consigne{font-family:var(--hand);font-size:25px;line-height:1.15;color:var(--ink);margin:0 0 14px}
.fb{border-left:4px solid var(--ok);background:var(--okbg);padding:10px 14px;margin:14px 0;border-radius:0 6px 6px 0}
.fb.mid{border-color:#B98A00;background:var(--midbg)}
.fb.bad{border-color:var(--red);background:var(--kobg)}
.fbh{font-family:var(--hand);font-size:22px;line-height:1;color:var(--ok);margin-bottom:4px}
.fb.mid .fbh{color:#9a6b00} .fb.bad .fbh{color:var(--red)}
.effs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.eff{font-size:12px;font-weight:700;border-radius:10px;padding:1px 8px;background:#fff;border:1px solid var(--line)}
.eff.p{color:var(--ok)} .eff.n{color:var(--red)}
.proofnote{font-family:var(--hand);font-size:21px;color:var(--red)}

/* presentation & courrier */
.team{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:6px}
.mcard{display:flex;gap:14px;background:var(--sheet);padding:16px;border-radius:3px;box-shadow:0 8px 20px rgba(60,40,20,.10);border-top:5px solid var(--c)}
.mn{font-family:var(--display);font-weight:700;font-size:20px;color:var(--ink)} .mr{font-size:13px;color:var(--c);font-weight:700}
.md{font-family:var(--hand);font-size:22px;line-height:1.1;color:#4a453d;margin:6px 0}
.mcard p{margin:0;font-size:14px;font-family:var(--serif)}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.rule{background:#FFF8DC;padding:12px 12px 10px;position:relative;box-shadow:0 3px 8px rgba(60,40,20,.08)}
.rule:nth-child(even){background:#E8F4F1}
.rule b{display:block;color:var(--ink);margin:2px 0 3px} .rule p{margin:0;font-size:14px}
.rn{font-family:var(--hand);font-size:28px;color:var(--red);line-height:.8}
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin:8px 0 24px}
.letter{background:#fff;padding:14px 16px;transform:rotate(var(--r));box-shadow:0 6px 16px rgba(60,40,20,.14);border-top:4px solid var(--kraft);font-family:var(--serif)}
.letter:nth-child(3n+2){background:#FFF6D6} .letter:nth-child(3n){background:#EEF4FB}
.lt{font-size:11px;font-weight:700;color:var(--lead);font-family:var(--sans)}
.letter p{margin:6px 0;font-style:italic} .ls{font-family:var(--hand);font-size:21px;color:var(--ink);text-align:right}

/* activities */
.mrow{display:grid;grid-template-columns:1fr minmax(240px,1fr);gap:12px;align-items:center;padding:9px 6px;border-bottom:1px dashed var(--line)}
.mrow select, .zrow select{font:inherit;padding:7px;border:1px solid var(--line);border-radius:4px;background:#fff;width:100%}
.mrow.good{background:linear-gradient(90deg,var(--okbg),transparent)}
.mrow.bad{background:linear-gradient(90deg,var(--kobg),transparent)}
.corr{font-size:13px;color:var(--lead);grid-column:1/-1}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:46px;padding:12px;border:2px dashed var(--kraft);border-radius:6px;margin-bottom:14px;background:#F7F1E4}
.tag{background:#fff;border:1.5px solid var(--ink);color:var(--ink);border-radius:3px;padding:5px 12px;font-size:14px;cursor:grab;user-select:none;box-shadow:2px 2px 0 rgba(31,58,95,.25);transform:rotate(-.8deg)}
.tag:nth-child(even){transform:rotate(.9deg)}
.tag.sel{background:var(--hl);border-color:#9b8400}
.docs3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.dcard{border:1px solid var(--line);border-radius:3px;padding:12px;background:#fff;box-shadow:0 4px 10px rgba(60,40,20,.06)}
.dcard h4{margin:0;font-family:var(--display);color:var(--ink);font-size:18px}
.slot{border:1.5px dashed #c3b7a2;border-radius:3px;min-height:42px;padding:6px;margin-bottom:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:#FCFAF4}
.slot .sl{font-size:11px;color:var(--lead);width:100%}
.slot.over{background:var(--midbg)} .slot.good{border:2px solid var(--ok);background:var(--okbg)} .slot.bad{border:2px solid var(--red);background:var(--kobg)}
.extract{font-family:var(--serif);font-size:16.5px;padding:11px 14px;border:1px solid var(--line);border-radius:3px;margin-bottom:9px;cursor:pointer;background:#fff}
.extract:hover{border-color:var(--ochre)}
.extract.on{background:linear-gradient(transparent 10%,var(--hl) 10%,var(--hl) 90%,transparent 90%);border-color:#c9a800}
.extract.good{outline:2px solid var(--ok)} .extract.bad{outline:2px solid var(--red)}
.extract .x{display:block;font-family:var(--sans);font-size:13px;color:var(--lead);margin-top:4px}
.spottext{font-family:var(--serif);font-size:19px;line-height:1.95;background:#fff;border:1px solid var(--line);padding:18px 20px;border-radius:3px;background-image:repeating-linear-gradient(transparent 0 36px,#e9e2d3 36px 37px)}
.seg{cursor:pointer;border-radius:3px;padding:1px 0}
.seg:hover{background:#FFF0B0} .seg.on{background:var(--hl)}
.seg.err{text-decoration:underline wavy var(--red);text-underline-offset:4px} .seg.miss{background:var(--kobg)} .seg.fp{background:#E9E5DD;text-decoration:line-through}
.errlist{margin:12px 0 0;padding-left:20px;font-size:14px}
.hs{display:grid;grid-template-columns:1.35fr 1fr;gap:20px;align-items:start}
.tableau{margin:0}
.tw{position:relative;line-height:0;border:10px solid #3a2a1c;box-shadow:inset 0 0 0 2px #b8955e,0 10px 24px rgba(40,25,10,.3)}
.tw img{width:100%;height:auto;display:block}
.noimg{line-height:1.4;padding:80px 20px;text-align:center;background:#eee}
.zone{position:absolute;border:2px dashed transparent;background:transparent;padding:0;cursor:pointer;border-radius:4px}
.zone:hover,.zone.on{border-color:var(--red);background:rgba(255,217,90,.28)}
.zfond{inset:0;border-radius:0} .zobj{left:6%;top:15%;width:90%;height:56%} .zins{left:12%;top:76%;width:69%;height:17%}
.zobj .zl{left:46%;top:-13px} .zins .zl{left:-13px;top:50%;margin-top:-13px}
.zl{position:absolute;top:-12px;left:-12px;width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;font:700 14px/26px var(--sans);text-align:center;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.zfond .zl{top:8px;left:8px}
.cartel{position:relative;display:block;margin:14px 0 0 auto;width:min(320px,100%);text-align:left;background:#fff;border:1px solid #d7d0c4;padding:9px 12px 9px 40px;font-size:13px;line-height:1.4;font-family:var(--sans);color:#333;border-radius:2px}
.cartel .zl{top:9px;left:8px}
.zrow{padding:8px 10px;border-radius:4px;margin-bottom:6px;border:1.5px solid var(--line);background:#fff;cursor:pointer}
.zrow.on{border-color:var(--red);background:#FFFBEA}
.zrow label{font-weight:700;font-size:14px;color:var(--ink);display:block;cursor:pointer}
.zrow .chosen{font-family:var(--serif);font-size:14px;margin-top:2px}
.pal{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.pal button{text-align:left;background:#fff;border:1px solid var(--line);border-left:4px solid var(--ochre);border-radius:3px;padding:8px 10px;font-size:14px}
.pal button:hover{border-color:var(--ink)} .pal button.used{color:#a39d93;border-left-color:#ddd}
table.cls{width:100%;border-collapse:collapse}
table.cls th{font-size:13px;color:var(--ink);text-align:center;padding:6px;border-bottom:2px solid var(--ink);width:16%}
table.cls th:first-child{text-align:left;width:52%}
table.cls td{padding:11px 6px;border-bottom:1px dashed var(--line);text-align:center}
table.cls td:first-child{text-align:left;font-family:var(--serif)}
table.cls input{width:18px;height:18px;accent-color:var(--ink)}
table.cls tr.good td:first-child{box-shadow:inset 4px 0 var(--ok)} table.cls tr.bad td:first-child{box-shadow:inset 4px 0 var(--red)}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:4px;padding:15px 18px;margin-bottom:12px;font-size:17px;font-family:var(--serif);box-shadow:0 3px 0 rgba(60,40,20,.08)}
.opt:hover{border-color:var(--ink);background:#FFFBEA}
.opt b{font-family:var(--display);font-size:22px;color:var(--red);margin-right:10px}
.opt.chosen{border:2px solid var(--ink);background:#EEF3F9}
.slrow{margin-bottom:20px}
.slrow .nm{font-weight:600;color:var(--ink);margin-bottom:4px}
.slrow input[type=range]{width:100%;accent-color:var(--red)}
.axis{display:flex;justify-content:space-between;font-family:var(--hand);font-size:20px;color:var(--lead)}
.zonebar{position:relative;height:8px;background:#EEE8DC;border-radius:4px;margin-top:4px}
.zonebar i{position:absolute;top:0;bottom:0;background:var(--okbg);border:1px solid var(--ok);border-radius:4px}
.zonebar b{position:absolute;top:-4px;width:4px;height:16px;background:var(--ink)}
.rank{padding:0;margin:0}
.rank li{list-style:none;display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:3px;padding:10px 12px;margin-bottom:8px;box-shadow:0 3px 8px rgba(60,40,20,.06)}
.rank li .pos{font-family:var(--display);font-weight:900;color:var(--red);font-size:24px;min-width:38px}
.rank li .tx{flex:1;font-family:var(--serif)}
.rank li.out{opacity:.5;text-decoration:line-through}
.rank li button{border:1px solid var(--line);background:#F7F1E4;border-radius:4px;padding:5px 9px;font-size:13px}
.sortrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:11px 6px;border-bottom:1px dashed var(--line);font-family:var(--serif)}
.vt{display:inline-flex}
.vt button{border:1.5px solid var(--ink);background:#fff;padding:6px 14px;font-weight:700;color:var(--ink)}
.vt button:first-child{border-radius:4px 0 0 4px} .vt button:last-child{border-radius:0 4px 4px 0;border-left:0}
.vt button.on{background:var(--ink);color:#fff}
.cloze{font-family:var(--serif);font-size:19px;line-height:2.2}
.cloze select{font:inherit;font-size:17px;padding:2px 4px;border:0;border-bottom:2px solid var(--ink);background:#FFF6D6}
.cloze select.good{border-color:var(--ok);background:var(--okbg)} .cloze select.bad{border-color:var(--red);background:var(--kobg)}
.sujets{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sujet{background:#fff;border:1.5px solid var(--line);border-radius:3px;padding:22px;text-align:left;font-family:var(--display);font-weight:500;font-size:21px;line-height:1.3;box-shadow:0 6px 14px rgba(60,40,20,.08);color:#24211C}
.sujet small{display:block;font-family:var(--hand);font-size:24px;color:var(--red);margin-bottom:4px}
.sujet:hover{border-color:var(--ink);transform:rotate(-.5deg)}
.sujet.chosen{border:2px solid var(--ink);background:#EEF3F9}
.checklist{list-style:none;padding:0;margin:8px 0 0;font-size:14px}
.checklist li::before{content:"○ ";color:var(--lead)} .checklist li.y::before{content:"● ";color:var(--ok)}

/* writing */
.qbox{border-left:5px solid var(--red);padding:4px 0 4px 14px;margin-bottom:12px}
.qbox .ql{font-weight:700;color:var(--ink)} .qbox .qt{font-family:var(--serif);font-size:17.5px}
.meth{background:#FFF8DC;border-radius:3px;padding:10px 14px;font-size:14px;margin-bottom:10px;box-shadow:0 2px 6px rgba(60,40,20,.06)}
.meth ul,.meth ol{margin:4px 0 0;padding-left:18px}
textarea.w{width:100%;min-height:170px;font-family:var(--serif);font-size:17px;line-height:1.7;padding:12px 16px;border:1px solid var(--line);border-radius:3px;resize:vertical;background:#fff;background-image:repeating-linear-gradient(transparent 0 28px,#f0eadf 28px 29px);background-attachment:local;background-position:0 11px}
textarea.w.sm{min-height:84px}
textarea.w[readonly]{background-color:#F7F4EE;color:#555}
.wc{font-size:13px;color:var(--lead);text-align:right;margin-top:3px} .wc.short{color:#9a6b00}
.caseL{font-size:14px;font-weight:700;color:var(--ink);margin:12px 0 3px}
.caseH{font-size:13px;color:var(--lead);margin:-2px 0 4px}
.partbox{border-top:3px double var(--ink);padding-top:10px;margin-top:24px}
.partbox h3{font-family:var(--display);color:var(--ink);margin:0 0 4px;font-size:23px}
.parabox{background:#FCFAF4;border:1px solid var(--line);border-radius:3px;padding:12px 14px;margin-top:12px}
.ficheMini{font-size:13px;background:#E8F4F1;border-radius:3px;padding:6px 10px;margin:4px 0 6px}

/* research */
.pcard{border:1px solid var(--line);border-radius:3px;background:#fff;margin-bottom:12px;box-shadow:0 3px 8px rgba(60,40,20,.05)}
.pcard>summary{list-style:none;padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:center}
.pcard>summary::-webkit-details-marker{display:none}
.pcard .st{font-size:12px;font-weight:700;border-radius:10px;padding:2px 9px;background:#F1EBDF;white-space:nowrap}
.pcard .st.v{background:var(--okbg);color:var(--ok)}
.pbody{padding:0 14px 14px}
.indice{border-left:4px solid var(--teal);background:#F2FAF8;padding:6px 10px;margin:6px 0;font-family:var(--serif)}
.indice small{display:block;font-family:var(--hand);color:var(--teal);font-size:19px;line-height:1}
.fgrid{display:grid;grid-template-columns:1fr 1fr 140px;gap:10px}
.fgrid .full{grid-column:1/-1}
.fgrid input,.fgrid select,.fgrid textarea{font:inherit;font-size:15px;padding:7px 9px;border:1px solid var(--line);border-radius:3px;width:100%;background:#fff}
.fgrid textarea{min-height:60px;font-family:var(--serif)}
.fgrid label{font-size:13px;font-weight:600;color:var(--ink)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)} .timer.over{color:var(--red)}
.dommap{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.dommap span{font-size:12px;border:1px solid var(--line);border-radius:12px;padding:2px 9px;color:#a39d93}
.dommap span.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.alerts{list-style:none;padding:0;margin:0}
.alerts li{padding:7px 10px;border-radius:3px;margin-bottom:5px;font-size:14px;background:var(--midbg);border-left:4px solid var(--ochre)}
.alerts li.okk{background:var(--okbg);border-left-color:var(--ok)}

/* modal / drawer */
.modal{position:fixed;inset:0;background:rgba(36,33,28,.6);display:flex;justify-content:center;align-items:flex-start;padding:30px 12px;z-index:50;overflow:auto}
.modal .box{background:var(--sheet);max-width:920px;width:100%;border-radius:3px;padding:24px 28px;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal .close{position:absolute;right:14px;top:12px;border:1px solid var(--line);background:#fff;border-radius:4px;padding:6px 10px}
.doctabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.doctabs button{border:1.5px solid var(--ink);background:#fff;border-radius:4px;padding:6px 12px;color:var(--ink);font-weight:600}
.doctabs button.on{background:var(--ink);color:#fff}
.doc h3{font-family:var(--display);color:var(--ink);margin:0 0 6px}
.doc .chap{font-style:italic;font-family:var(--serif);color:var(--lead);margin-bottom:8px}
.docimg{max-width:100%;border:8px solid #3a2a1c;margin:6px 0}
.lines{font-family:var(--serif);font-size:16px;line-height:1.65;overflow-x:auto}
.lines .ln{display:grid;grid-template-columns:34px auto;white-space:pre}
.lines .ln .no{color:#a39d93;font-family:var(--sans);font-size:12px;text-align:right;padding-right:10px;padding-top:3px}
.lines .gap{height:8px}
.notes{font-size:13px;color:var(--lead);margin-top:10px}
#drawer{position:fixed;top:0;right:0;width:min(580px,100vw);height:100vh;background:var(--sheet);box-shadow:-14px 0 40px rgba(40,25,10,.2);z-index:40;display:flex;flex-direction:column}
#drawer header{padding:14px 18px;border-bottom:3px double var(--ink);display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-size:20px;color:var(--ink)}
#drawer .body{padding:20px 28px 20px 46px;overflow:auto;font-family:var(--serif);font-size:15px;line-height:1.75;background-image:linear-gradient(90deg,transparent 30px,rgba(200,36,47,.5) 30px 31px,transparent 31px)}
.cp h4{font-family:var(--sans);font-size:13px;color:var(--ink);margin:18px 0 4px}
.cp p{margin:0 0 10px;text-indent:1.5em}
.cp .empty{color:#a39d93;font-style:italic;text-indent:0}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#24211C;color:#fff;padding:11px 18px;border-radius:4px;z-index:60;font-size:14px;max-width:90vw;box-shadow:0 8px 20px rgba(0,0,0,.25)}

/* final */
.frontpage{background:var(--sheet);margin:22px 0;padding:22px 28px 20px;box-shadow:0 12px 30px rgba(60,40,20,.15);border-top:6px solid var(--ink)}
.fpm{font-family:var(--display);font-weight:900;font-size:62px;color:var(--ink);text-align:center;line-height:1;border-bottom:3px double var(--ink);padding-bottom:8px}
.fpd{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--lead);border-bottom:1px solid var(--ink);padding:5px 0;flex-wrap:wrap}
.fpk{font-family:var(--hand);font-size:24px;color:var(--red);margin-top:14px}
.fph{font-family:var(--display);font-weight:900;font-size:clamp(28px,4vw,42px);line-height:1.08;margin:4px 0 14px;color:#24211C}
.fpr{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--lead)}
.stamp{font-family:var(--display);font-weight:900;font-size:22px;color:var(--red);border:3px solid var(--red);padding:4px 12px;transform:rotate(-4deg);display:inline-block}
.consigneBox{background:var(--ink);color:#fff;border-radius:3px;padding:14px 18px;margin:16px 0}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cmp>div{border:1px solid var(--line);border-radius:3px;padding:12px 14px;font-family:var(--serif);font-size:15px;line-height:1.6;background:#fff}
.cmp h5{font-family:var(--sans);margin:0 0 6px;color:var(--ink);font-size:13px}
.cmp .mine{background:#FCFAF4}
.ae{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.ae .vt button{font-size:12px;padding:4px 9px;font-weight:600}
.ref li{margin-bottom:4px}

@media (max-width:1000px){
  #boot{grid-template-columns:1fr} .cover,.bootform{transform:none}
  #app{grid-template-columns:1fr}
  #side{position:static;height:auto}
  .docs3,.grid2,.sujets,.hs,.cmp,.team,.rules{grid-template-columns:1fr}
  .mrow{grid-template-columns:1fr} .fgrid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div id="boot"></div>
<div id="app" class="hidden">
  <aside id="side"></aside>
  <main id="main"></main>
</div>
<div id="drawer" class="hidden"></div>
<div id="modal" class="modal hidden"></div>
<div id="toast" class="hidden"></div>
<input type="file" id="fileIn" accept=".json,application/json" class="hidden">
<input type="file" id="corrIn" accept=".json,application/json" class="hidden">

const DATA = {"meta":{"revue":"La Revue","numero":"Numéro spécial n°1","theme":"Le vrai du faux","titre":"La fiction, un « mentir-vrai »","session":"BTS blanc — Session 2027","epreuve":"Culture générale et expression"},"cast":{"helene":{"nom":"Hélène Marceau","role":"Rédactrice en chef","ini":"HM","color":"#1F3A5F"},"samuel":{"nom":"Samuel Roche","role":"Documentaliste","ini":"SR","color":"#2E7D6B"},"victor":{"nom":"Victor Lagarde","role":"Chroniqueur","ini":"VL","color":"#B5452B"},"lina":{"nom":"Lina","role":"Stagiaire","ini":"L","color":"#7A5BA6"}},"jauges":[{"id":"F","nom":"Fidélité","desc":"Compréhension juste du corpus"},{"id":"A","nom":"Argumentation","desc":"Problématique, confrontation et plan"},{"id":"C","nom":"Culture","desc":"Exemples précis, variés, vérifiés"},{"id":"P","nom":"Plume","desc":"Correction et clarté de l’expression"}],"docs":[{"id":1,"titre":"Document 1 : Denis Diderot, Les Deux Amis de Bourbonne, 1773","chapeau":"Après avoir raconté l’histoire de deux amis, le narrateur conclut son conte par une réflexion adressée au lecteur.","paras":["Et puis, il y a trois sortes de contes... Il y en a bien davantage, me direz-vous... À la bonne heure ; mais je distingue le conte à la manière d’Homère, de Virgile, du Tasse¹, et je l’appelle le conte merveilleux. La nature y est exagérée ; la vérité y est hypothétique : et si le conteur a bien gardé le module² qu’il a choisi, si tout répond à ce module, et dans les actions, et dans les discours, il a obtenu le degré de perfection que le genre de son ouvrage comportait, et vous n’avez rien de plus à lui demander. En entrant dans son poëme, vous mettez le pied dans une terre inconnue, où rien ne se passe comme dans celle que vous habitez, mais où tout se fait en grand comme les choses se font autour de vous en petit. Il y a le conte plaisant à la façon de La Fontaine, de Vergier, de l’Arioste, d’Hamilton³, où le conteur ne se propose ni l’imitation de la nature, ni la vérité, ni l’illusion ; il s’élance dans les espaces imaginaires. Dites à celui-ci : Soyez gai, ingénieux, varié, original, même extravagant, j’y consens ; mais séduisez-moi par les détails ; que le charme de la forme me dérobe toujours l’invraisemblance du fond : et si ce conteur fait ce que vous exigez ici, il a tout fait. Il y a enfin le conte historique, tel qu’il est écrit dans les Nouvelles de Scarron, de Cervantes, de Marmontel⁴...","— Au diable le conte et le conteur historiques ! c’est un menteur plat et froid...","— Oui, s’il ne sait pas son métier. Celui-ci se propose de vous tromper ; il est assis au coin de votre âtre⁵ ; il a pour objet la vérité rigoureuse ; il veut être cru ; il veut intéresser, toucher, entraîner, émouvoir, faire frissonner la peau et couler les larmes ; effet qu’on n’obtient point sans éloquence et sans poésie. Mais l’éloquence est une sorte de mensonge, et rien de plus contraire à l’illusion que la poésie ; l’une et l’autre exagèrent, surfont⁶, amplifient, inspirent la méfiance : comment s’y prendra donc ce conteur-ci pour vous tromper ? Le voici. Il parsèmera son récit de petites circonstances si liées à la chose, de traits si simples, si naturels, et toutefois si difficiles à imaginer, que vous serez forcé de vous dire en vous-même : Ma foi, cela est vrai : on n’invente pas ces choses-là. C’est ainsi qu’il sauvera l’exagération de l’éloquence et de la poésie ; que la vérité de la nature couvrira le prestige de l’art ; et qu’il satisfera à deux conditions qui semblent contradictoires, d’être en même temps historien et poëte, véridique et menteur.","Un exemple emprunté d’un autre art rendra peut-être plus sensible ce que je veux vous dire. Un peintre exécute sur la toile une tête. Toutes les formes en sont fortes, grandes et régulières ; c’est l’ensemble le plus parfait et le plus rare. J’éprouve, en le considérant, du respect, de l’admiration, de l’effroi. J’en cherche le modèle dans la nature, et ne l’y trouve pas ; en comparaison, tout y est faible, petit et mesquin ; c’est une tête idéale ; je le sens, je me le dis. Mais que l’artiste me fasse apercevoir au front de cette tête une cicatrice légère, une verrue à l’une de ses tempes, une coupure imperceptible à la lèvre inférieure ; et, d’idéale qu’elle était, à l’instant la tête devient un portrait ; une marque de petite vérole⁷ au coin de l’œil ou à côté du nez, et ce visage de femme n’est plus celui de Vénus ; c’est le portrait de quelqu’une de mes voisines. Je dirai donc à nos conteurs historiques : Vos figures sont belles, si vous voulez ; mais il y manque la verrue à la tempe, la coupure à la lèvre, la marque de petite vérole à côté du nez, qui les rendraient vraies ; et, comme disait mon ami Caillot⁸ : « Un peu de poussière sur mes souliers, et je ne sors pas de ma loge, je reviens de la campagne. »"],"source":"Denis Diderot, Les Deux Amis de Bourbonne, postface (texte de l’édition J. Assézat, Garnier frères, 1875).","notes":["1. Homère, Virgile, le Tasse : poètes épiques de l’Antiquité grecque, de l’Antiquité latine et de la Renaissance italienne.","2. module : ici, l’échelle ou le modèle choisi par le conteur, auquel tout le récit doit rester conforme.","3. La Fontaine, Vergier, l’Arioste, Hamilton : auteurs de contes plaisants, en vers ou en prose.","4. Scarron, Cervantes, Marmontel : auteurs de nouvelles et de récits réalistes (XVIIe-XVIIIe siècles).","5. âtre : foyer de la cheminée.","6. surfont : du verbe surfaire, exagèrent la valeur des choses.","7. petite vérole : variole, maladie qui laissait des cicatrices sur la peau.","8. Caillot : acteur de la Comédie-Italienne (note de l’édition Assézat)."],"lines":[{"n":1,"t":"Et puis, il y a trois sortes de contes... Il y en a bien davantage, me","p":1},{"n":2,"t":"direz-vous... À la bonne heure ; mais je distingue le conte à la manière","p":1},{"n":3,"t":"d’Homère, de Virgile, du Tasse¹, et je l’appelle le conte merveilleux. La","p":1},{"n":4,"t":"nature y est exagérée ; la vérité y est hypothétique : et si le conteur a b es, certains, comme American Bluff, jouent la carte de l’honnêteté : au début du film, l’inscription sur fond noir ne dit pas « ceci est tiré d’une histoire vraie » mais « Some of this actually happened » (« Certains de ces événements se sont effectivement produits »). Un choix judicieux puisque, selon nos calculs, le film de David O. Russell n’est qu’à 56 % vrai.","À l’ère du fact-check, la meilleure stratégie pour les films qui s’éloignent de la vérité reste donc de faire appel à l’humour ou à l’émotionnel, se concentrer sur le message du film plutôt que sur ses détails. Selon Michel Burstein :","« L’authenticité d’un fait est une des clés pour faire admettre, pour convaincre, pour émouvoir. »","Fruitvale Station, dont il a assuré la promotion en décembre dernier, décrit les dernières 24 heures d’Oscar Grant, un jeune Afro-Américain tué par un policier suite à une bagarre dans le métro.","La plupart des éléments du film sont vrais, y compris les plus incroyables : Oscar Grant a bien été tué le soir du Nouvel An, juste après l’anniversaire de sa mère, et c’est cette dernière qui l’avait encouragé à prendre le métro.","Le film prend tout de même quelques libertés : non seulement le personnage de Katie a été inventé, mais à plusieurs moments de la journée, le vrai Oscar était seul. Le réalisateur Ryan Coogler a donc dû lui trouver des occupations : on le voit prendre soin d’un chien écrasé, jeter son herbe dans l’océan plutôt que la vendre... Bref, des moments touchants qui renforcent le sentiment d’injustice du spectateur et son attachement au personnage.","En France, le distributeur a choisi de sortir le film un 1er janvier, jour anniversaire de la mort d’Oscar Grant :","« Cela expose mieux le film, le place dans un contexte émotionnel important. »","Reste à savoir si un film fonctionne plus pour la « sincérité de son regard » que pour la véracité de ses faits."],"source":"Anaïs Bordages, Slate.fr, 2 mars 2014 (extraits).","notes":[],"lines":[{"n":1,"t":"Il faut sa ncée (oui, mais…)."]}],"sujets":[{"id":1,"texte":"Faut-il qu’une histoire soit vraie pour nous toucher ?"},{"id":2,"texte":"Selon vous, une entreprise qui raconte une belle histoire pour vendre ses produits trompe-t-elle ses clients ?"}],"consigneEssai":"Vous répondrez à cette question d’une façon argumentée, en vous appuyant sur les documents du corpus, sur vos lectures de l’année et sur vos connaissances personnelles.","plans":{"1":{"blocs":[{"id":"p1","txt":"Une histoire vraie nous touche par son authenticité : savoir que les faits ont eu lieu donne du poids à l’émotion."},{"id":"p2","txt":"Mais la fiction nous touche tout autant, car ce qui compte est la vraisemblance, pas la vérité des faits."},{"id":"p3","txt":"Ce qui nous touche est une vérité humaine plus qu’une vérité des faits : c’est le « mentir-vrai »."},{"id":"x","txt":"Les films d’horreur sont souvent de mauvaise qualité.","intrus":true}],"ordre":["p1","p2","p3"],"titres":["L’authenticité, source d’émotion","Le pouvoir propre de la fiction","Une vérité humaine plutôt qu’une vérité des faits"]},"2":{"blocs":[{"id":"p1","txt":"Le récit de marque peut tromper : origine inventée, émotion qui court-circuite le jugement du client."},{"id":"p2","txt":"Mais tout récit n’est pas un mensonge : le client connaît souvent le jeu, et le récit peut porter des valeurs réelles."},{"id":"p3","txt":"La tromperie commence quand le récit falsifie des faits vérifiables (origine, qualité, engagement)."},{"id":"x","txt":"Les entreprises doivent faire de la publicité pour survivre.","intrus":true}],"ordre":["p1","p2","p3"],"titres":["Quand le récit trompe","Un récit n’est pas forcément un mensonge","Le critère : des faits vérifiables"]}},"pistes":{"1":[{"part":0,"para":0,"n1":"La littérature de témoignage.","n2":"Un récit écrit à la première personne par quelqu’un qui a vécu un événement historique tragique.","n3":"Mots-clés : « témoignage déportation » ou « journal guerre adolescente ». Source conseillée : le site d’un mémorial ou d’un musée d’histoire."},{"part":0,"para":1,"n1":"Le cinéma « inspiré de faits réels ».","n2":"Un film français à grand succès sur une amitié improbable entre deux hommes que tout oppose.","n3":"Années 2010. Source conseillée : le site du CNC, Allociné ou un grand quotidien."},{"part":1,"para":0,"n1":"Les grands romans du XIXe siècle.","n2":"Des personnages inventés dont les malheurs font pleurer les lecteurs depuis plus de 150 ans.","n3":"Un roman social français : misère, injustice, une mère prête à tout pour sa fille."},{"part":1,"para":1,"n1":"La philosophie de l’art et de la fiction.","n2":"Pourquoi aime-t-on avoir peur ou pleurer devant une histoire qu’on sait inventée ?","n3":"Mots-clés : « catharsis Aristote » et « suspension consentie de l’incrédulité »."},{"part":2,"para":0,"n1":"Le cinéma qui joue avec le faux.","n2":"Un film qui affirme dès le début « ceci est une histoire vraie »… alors que tout est inventé.","n3":"Un polar américain des années 1990, dans la neige du Minnesota."},{"part":2,"para":1,"n1":"Littérature et enquête de terrain.","n2":"Un roman fondé sur une véritable enquête : l’auteur est allé observer le monde qu’il raconte.","n3":"La mine, le XIXe siècle, le naturalisme."}],"2":[{"part":0,"para":0,"n1":"Les marques alimentaires et leur nom.","n2":"Une marque dont le nom « étranger » a été inventé de toutes pièces pour sembler raffiné.","n3":"Des glaces, New York, autour de 1960."},{"part":0,"para":1,"n1":"Les scandales industriels.","n2":"Une campagne qui vantait un produit « propre », démentie par les faits.","n3":"L’automobile, 2015, les émissions polluantes."},{"part":1,"para":0,"n1":"Les marques qui racontent leur vraie histoire.","n2":"Des fondateurs qui mettent en scène leur aventure réelle, avec humour, sur leurs emballages.","n3":"Des biscuits, deux jeunes entrepreneurs français, années 2000."},{"part":1,"para":1,"n1":"La contre-publicité.","n2":"Une marque qui a demandé publiquement… de ne pas acheter son produit.","n3":"Vêtements de plein air, Black Friday, un grand journal américain."},{"part":2,"para":0,"n1":"Le droit de la consommation.","n2":"Ce que la loi interdit de faire croire au client pour lui vendre un produit.","n3":"Mots-clés : « pratique commerciale trompeuse » ou « greenwashing directive européenne ». Source conseillée : un site gouvernemental."},{"part":2,"para":1,"n1":"Les légendes marketing.","n2":"Une « vérité » sur une marque que tout le monde répète… et qui est fausse.","n3":"Un soda, Noël, la couleur rouge. Attention : vérifiez !"}]},"domaines":["Littérature","Cinéma et séries","Arts (peinture, BD, musique)","Histoire","Actualité et société","Économie et entreprises","Droit","Philosophie et sciences","Vie quotidienne"],"steps":[{"id":"s0","phase":"Prologue","titre":"Le faux témoignage","type":"scene","lieu":"Locaux de La Revue, lundi, 8 h 57","scene":[["narr","Les locaux de La Revue sentent le café froid et la panique. Au-dessus de l’accueil, le compteur d’abonnés clignote : {abonnes}. Il y a une semaine, ils étaient plus de 3 000."],["narr","En cause : « Ma vie sans fin », le témoignage bouleversant d’une lectrice publié dans le dernier numéro. Des milliers de partages, des centaines de lettres émues… et hier soir, la révélation : la lectrice n’existe pas. Le texte était entièrement inventé."],["lina","Bonjour… C’est bien ici, La Revue ? Je suis Lina, la nouvelle stagiaire. C’est mon premier jour."],["victor","Bienvenue sur le Titanic, Lina. Les gilets de sauvetage sont sous les bureaux."],["victor","Entre nous, ce témoignage était sublime. Les lecteurs ont pleuré. Si ce n’est pas la preuve qu’il était réussi…"],["samuel","Ils ont pleuré parce qu’ils le croyaient vrai, Victor. Personne n’a vérifié. Pas une date, pas un nom, pas une source."],["narr","Une porte claque. Hélène Marceau traverse la salle, le dernier numéro roulé dans la main comme une matraque."],["helene","Ça suffit. J’ai passé la nuit au téléphone avec nos actionnaires. Ils nous laissent une seule chance : un numéro spécial, bouclé en deux jours."],["helene","Et le thème, je l’ai choisi : ce qui vient de nous arriver. « La fiction, un mentir-vrai ». Trois documents, trois questions, un éditorial. Si on rate celui-là, La Revue ferme."],["lina","Deux jours pour sauver un journal… le jour de mon arrivée."],["helene","Alors tu vas apprendre vite. Et vous aussi, les nouveaux du comité. Samuel, fais-leur le tour de la maison. Conférence dans dix minutes."]],"bouton":"Suivre Samuel"},{"id":"pres","phase":"Prologue","titre":"La rédaction","type":"presentation","lieu":"Le couloir de la rédaction, 9 h 05","scene":[["samuel","Asseyez-vous deux minutes. Pour survivre ici, il faut savoir à qui on a affaire, et comment on compte les points."],["victor","Il va vous dire que je suis dangereux. C’est faux : je suis brillant."]],"equipe":[{"who":"helene","attend":"Une problématique claire, un plan qui avance, des réponses qui répondent vraiment à la question posée.","devise":"Une idée sans plan, c’est un brouillon."},{"who":"samuel","attend":"Des citations exactes avec leurs lignes, des dates, des sources vérifiées. Il récompense la rigueur.","devise":"Un exemple sans date, c’est une rumeur."},{"who":"victor","attend":"Il propose des raccourcis, des formules choc, des opinions sans preuve. Souvent tentant, presque toujours coûteux.","devise":"Le lecteur veut de l’émotion, pas des notes de bas de page."},{"who":"lina","attend":"Ses premiers jets… et leurs erreurs. En l’aidant à les repérer, vous apprenez à ne pas les commettre.","devise":"J’apprends ! (et je me relis… parfois)"}],"regles":[["Les quatre jauges","Fidélité (comprendre le corpus), Argumentation (problématique, confrontation, plan), Culture (vos exemples), Plume (votre expression). Elles partent de 10 sur 20."],["Les abonnés","Le compteur en haut de l’écran suit vos jauges. Chaque bonne décision ramène des lecteurs ; chaque erreur en fait fuir."],["Les relations","Chaque personnage vous accorde une confiance de 0 à 3. Elle change ce qu’ils vous disent… et la fin de l’histoire."],["Le débat d’équipe","Avant chaque validation, l’équipe discute. Si personne ne sait dire pourquoi, on ne valide pas."],["Votre copie","À chaque étape de rédaction, vous écrivez vous-même une partie de votre copie d’examen. Elle s’assemble dans « Ma copie »."],["Le brouillon","Rien n’est enregistré tout seul. Pensez à « Enregistrer un brouillon » à chaque fin de séance."]],"fin":[["lina","Et si je me trompe ?"],["samuel","Ici, tu as le droit. C’est fait pour ça. Le jour de l’examen, beaucoup moins."],["helene","Conférence ! Tout le monde, maintenant !"]],"bouton":"Entrer en conférence de rédaction"},{"id":"s1","phase":"Conférence de rédaction","titre":"Le lexique du numéro","type":"match","lieu":"Salle de rédaction, 9 h 20","scene":[["narr","Une grande table couverte de journaux, un tableau blanc où quelqu’un a écrit « VRAI ? » en lettres rouges."],["helene","Avant d’écrire une ligne, on se met d’accord sur les mots. Le mois dernier, on a confondu deux choses : ce qui paraît vrai, et ce qui est vrai."],["victor","C’est pareil, non ? Si ça paraît vrai, c’est vrai."],["samuel","Non. C’est exactement la différence entre un témoignage et une rumeur."],["lina","Je peux écrire les définitions au tableau ? Vous me dites quel mot va où."],["helene","Vas-y. Et attention : Victor a glissé trois mots qui n’ont rien à faire là."]],"consigne":"Associez chaque définition au mot qui convient. Attention, trois mots sont des intrus.","options":["Documentaire","Fiction","Hyperbole","Illusion","Paradoxe","Satire","Storytelling","Véracité","Vraisemblance"],"items":[{"q":"Ce qui PARAÎT vrai, ce que le lecteur peut croire.","a":"Vraisemblance"},{"q":"Usage d’un récit pour convaincre ou pour vendre.","a":"Storytelling"},{"q":"Récit inventé, qui ne prétend pas rapporter des faits réels.","a":"Fiction"},{"q":"Affirmation qui semble contradictoire mais révèle une vérité.","a":"Paradoxe"},{"q":"Ce qui EST conforme aux faits réels.","a":"Véracité"},{"q":"Erreur qui fait prendre l’apparence pour la réalité.","a":"Illusion"}],"bareme":{"jauge":"F","seuils":[[6,2],[4,1],[0,-1]]},"piege":{"siConfond":["Vraisemblance","Véracité"],"qui":"samuel","txt":"Vraisemblance et véracité inversées : c’est exactement l’erreur qu’on a faite avec le témoignage. Il paraissait vrai ; il ne l’était pas."},"react":{"good":[["helene","Bien. Nous parlons enfin la même langue."],["lina","J’ai tout noté au tableau. En rouge, les deux qu’il ne faut jamais confondre."]],"mid":[["helene","Presque. Relisez la correction : ces mots reviendront dans toutes vos réponses."]],"bad":[["victor","Des mots, des mots… Moi j’écris avec mes tripes."],["helene","Justement, Victor. Relisez la correction avant de continuer, tous."]]}},{"id":"s2","phase":"L’enquête","titre":"Fiches d’identité des documents","type":"tags","lieu":"Le bureau de Samuel, 9 h 45","scene":[["narr","Le bureau de Samuel ressemble à une bibliothèque qui aurait explosé. Trois documents sont épinglés au mur, au-dessus d’une boîte d’étiquettes."],["samuel","Premier réflexe de documentaliste : qui parle, quand, et sous quelle forme ?"],["samuel","Un philosophe du XVIIIe siècle, une journaliste de 2014 et un peintre de 1929 ne parlent pas depuis la même place. Si tu les mélanges, tu fais des contresens."],["lina","Et pourquoi il y a plus d’étiquettes que de cases ?"],["samuel","Des pièges. Victor les a ajoutées pour s’amuser."],["victor","Pour vous former ! Nuance."]],"consigne":"Placez chaque étiquette dans la bonne case (cliquez sur une étiquette, puis sur la case). Cinq étiquettes sont des pièges.","slots":["Nature","Époque","Courant ou contexte"],"tags":[{"t":"Postface d’un conte","doc":1,"slot":0},{"t":"XVIIIe siècle","doc":1,"slot":1},{"t":"Les Lumières","doc":1,"slot":2},{"t":"Article de presse en ligne","doc":2,"slot":0},{"t":"2014","doc":2,"slot":1},{"t":"La saison des Oscars","doc":2,"slot":2},{"t":"Huile sur toile","doc":3,"slot":0},{"t":"1929","doc":3,"slot":1},{"t":"Le surréalisme","doc":3,"slot":2},{"t":"Roman épistolaire","piege":true},{"t":"1870","piege":true,"msg":"Ni 1870 ni 1875 (date de l’édition Assézat) : le texte a été écrit en 1770 et publié en 1773. L’édition n’est pas l’œuvre."},{"t":"Documentaire","piege":true},{"t":"Publicité","piege":true},{"t":"L’impressionnisme","piege":true}],"bareme":{"jauge":"F","seuils":[[9,2],[7,1],[0,-1]]},"react":{"good":[["samuel","Fiches impeccables. Trois époques, trois formes : un conte philosophique, un article, une peinture. Garde ça en tête pour la confrontation."],["victor","Aucun de mes pièges n’a marché ? Vous êtes pénibles."]],"mid":[["samuel","Quelques confusions. Regarde la correction : la date et la nature d’un document changent sa portée."]],"bad":[["victor","Ha ! Mes pièges fonctionnent à merveille."],["samuel","Ce n’est pas un compliment, Victor. Reprends la correction avant de citer ces documents."]]}},{"id":"s3","phase":"L’enquête","titre":"Le surligneur de Samuel","type":"highlight","lieu":"Le bureau de Samuel, 10 h","scene":[["samuel","Diderot répond à une question précise : COMMENT le conteur historique réussit-il à se faire croire ?"],["lina","« Il veut être cru », c’est écrit là ! Je surligne ?"],["samuel","Doucement. Ça, c’est ce qu’il VEUT. Je te demande COMMENT il y arrive. Le but et le moyen, ce n’est pas la même chose."],["samuel","Tiens, mon surligneur jaune. Deux passages, pas un de plus. Et pas n’importe lesquels."],["helene","Bon début, l’équipe. Continuez comme ça.","F>=13"]],"consigne":"Surlignez les DEUX passages qui expliquent comment le conteur historique se fait croire (cliquez pour surligner, recliquez pour retirer).","doc":1,"ordre":[0,3,1,4,2],"phrases":[{"t":"« il veut être cru ; il veut intéresser, toucher, entraîner, émouvoir »","ok":false,"expl":"C’est le BUT du conteur (ce qu’il veut), pas le MOYEN (comment il y parvient). Confusion classique."},{"t":"« Il parsèmera son récit de petites circonstances si liées à la chose, de traits si simples, si naturels… »","ok":true,"expl":"Le moyen principal : le détail concret, simple, difficile à inventer."},{"t":"« que l’artiste me fasse apercevoir au front de cette tête une cicatrice légère, une verrue à l’une de ses tempes »","ok":true,"expl":"Le même moyen, illustré par la comparaison avec la peinture : l’imperfection rend vrai."},{"t":"« Au diable le conte et le conteur historiques ! »","ok":false,"expl":"C’est l’objection d’un interlocuteur, pas l’explication de Diderot."},{"t":"« En entrant dans son poëme, vous mettez le pied dans une terre inconnue »","ok":false,"expl":"Ce passage concerne le conte MERVEILLEUX, pas le conte historique."}],"max":2,"react":{"good":[["samuel","Exactement. Le but, tout le monde le voit ; le moyen, c’est ce que la question 1 te demande."],["lina","La verrue ! Un tout petit défaut, et le portrait devient vrai. C’est malin, Diderot."]],"mid":[["samuel","Un passage juste sur deux. Relis l’explication : c’est la différence entre un 2 et un 4 à la question 1."]],"bad":[["samuel","Tu as surligné ce que Diderot veut, ou ce qu’il dit d’un autre conte. Relis bien la correction."]]}},{"id":"s4","phase":"L’enquête","titre":"Le résumé piégé","type":"spot","lieu":"Le bureau de Samuel, 10 h 20","scene":[["narr","Samuel bâille. Trois tasses vides entourent une feuille couverte de ratures."],["samuel","J’ai résumé l’article de Slate cette nuit. À trois heures du matin, on n’est pas au mieux de sa forme."],["samuel","Une de mes phrases dit le contraire de l’article. Si on la publie, on refait exactement l’erreur du faux témoignage : affirmer sans vérifier."],["victor","Moi, je l’aurais publié tel quel. Personne ne lit les résumés."],["helene","Les correcteurs de BTS, si, Victor. Mot par mot."]],"consigne":"Cliquez sur la phrase qui trahit le sens du document 2.","multi":false,"segments":[{"t":"L’article rappelle que l’étiquette « histoire vraie » est un argument de vente ancien, déjà utilisé par Hitchcock en 1956. "},{"t":"Certains films avouent prendre des libertés, comme American Bluff, qui annonce que « certains » événements seulement ont eu lieu. "},{"t":"Aujourd’hui encore, le public croit sans difficulté tout film présenté comme vrai. ","err":true,"expl":"Contresens : l’article affirme l’inverse (« le public n’est plus dupe »). À l’ère du fact-check, un faux « histoire vraie » est démasqué très vite."},{"t":"Fruitvale Station respecte l’essentiel des faits mais invente des scènes touchantes pour renforcer l’attachement au personnage."}],"bareme":{"jauge":"F","juste":2,"faux":-1},"react":{"good":[["samuel","Bien vu. Un résumé qui trahit le texte, c’est un contresens dans ta copie : ça coûte très cher."],["samuel","Je vais me coucher plus tôt ce soir."]],"bad":[["victor","Ah, toi aussi tu crois tout ce qu’on te raconte ? Comme nos lecteurs le mois dernier…"],["samuel","La phrase fautive était : « le public croit sans difficulté ». L’article dit exactement l’inverse."]]}},{"id":"s5","phase":"L’enquête","titre":"Le tableau de Magritte","type":"hotspot","lieu":"Le mur des images, 10 h 40","scene":[["narr","Au fond de la salle, Hélène a punaisé la reproduction d’un tableau. Toute l’équipe s’est arrêtée devant."],["lina","Mais… c’est une pipe. Et c’est écrit que ce n’est pas une pipe. Il se moque de nous ?"],["victor","Évidemment ! Les surréalistes adoraient provoquer. Ça ne veut rien dire, voilà tout."],["samuel","Ça veut dire beaucoup, au contraire. Regarde chaque zone du tableau et demande-toi ce qu’elle fait."],["helene","Et lisez le titre sur le cartel. Un titre, ce n’est jamais décoratif."]],"consigne":"Cliquez sur une zone du tableau, puis choisissez le procédé qui lui correspond.","zones":[{"id":"z1","nom":"L’objet représenté","a":"Représentation réaliste et soignée : on reconnaît immédiatement l’objet, l’illusion fonctionne"},{"id":"z2","nom":"L’inscription","a":"Écriture appliquée d’écolier, comme une légende de manuel, qui contredit ce que montre l’image"},{"id":"z3","nom":"Le fond","a":"Fond uni, sans décor : l’objet est isolé comme dans une planche pédagogique"},{"id":"z4","nom":"Le titre de l’œuvre (cartel)","a":"« La Trahison des images » : le titre donne la clé du paradoxe"}],"distracteurs":["Perspective en trompe-l’œil qui ouvre sur un paysage","Couleurs vives et déformations qui expriment une émotion violente"],"bareme":{"jauge":"F","parBonne":0.5},"react":{"good":[["samuel","Tu as tout ce qu’il faut pour la question 2 : décrire, énoncer le paradoxe, le résoudre grâce au titre."],["lina","Donc ce n’est pas une pipe… c’est l’image d’une pipe ! On ne peut pas la fumer !"],["victor","…D’accord, c’est assez malin."]],"mid":[["samuel","Regarde la correction : chaque zone est un argument pour ta réponse à la question 2."]],"bad":[["samuel","Reprends la correction zone par zone. Le titre, surtout : c’est la clé."]]}},{"id":"w12","phase":"L’enquête","titre":"Rédaction : questions 1 et 2","type":"write","lieu":"Votre bureau, 11 h","scene":[["helene","Vous avez ce qu’il faut. Questions 1 et 2, maintenant."],["helene","Trois règles : on cite entre guillemets, on donne la ligne, on répond à la question posée. Pas de résumé document par document."],["samuel","Le corpus est dans le bandeau du haut, avec les lignes numérotées. Les mêmes que sur votre feuille."],["lina","Je peux copier-coller les citations, pour aller plus vite ?"],["samuel","Non. Tu les recopies. Ça oblige à les lire."]],"champs":["q1","q2"]},{"id":"s6","phase":"La confrontation","titre":"La table de confrontation","type":"classify","lieu":"Grande table de rédaction, 11 h 45","scene":[["narr","La grande table disparaît sous les feuilles. Hélène trace trois colonnes au feutre sur le tableau blanc."],["helene","Confronter, ce n’est pas résumer un document puis l’autre. C’est montrer où ils se rejoignent, où ils divergent, où ils se nuancent."],["lina","Comme un débat entre Diderot, une journaliste et Magritte ?"],["helene","Exactement. Et vous êtes l’arbitre. Je lis des affirmations ; pour chacune, vous tranchez."]],"consigne":"Pour chaque affirmation, indiquez la relation entre les documents.","colonnes":["Les documents convergent","Ils se rejoignent en partie (nuance)","Les documents s’opposent"],"items":[{"t":"Le petit détail concret rend un récit crédible.","a":0,"expl":"Convergence : la verrue de Diderot (doc. 1) et les scènes inventées de Fruitvale Station (doc. 2) jouent le même rôle."},{"t":"Le public se laisse facilement tromper.","a":2,"expl":"Opposition : Diderot imagine un lecteur qui se dit « on n’invente pas ces choses-là » ; Slate affirme que « le public n’est plus dupe »."},{"t":"Une œuvre peut reconnaître ouvertement sa part d’invention.","a":1,"expl":"Nuance : Magritte (doc. 3) et American Bluff (doc. 2) avouent leur part de fiction, mais le conteur de Diderot (doc. 1) cache son art."},{"t":"L’émotion compte davantage que l’exactitude des faits.","a":0,"expl":"Convergence : Diderot veut « émouvoir » par l’art ; Slate conclut sur la « sincérité de son regard » plutôt que la véracité des faits."}],"bareme":{"jauge":"F","seuils":[[4,2],[3,1],[0,0]]},"react":{"good":[["helene","Voilà une vraie confrontation. Gardez ce tableau sous les yeux pour la question 3."]],"mid":[["helene","Une erreur de lecture. Relisez l’explication avant d’écrire."]],"bad":[["helene","Le corpus n’est pas encore clair pour vous. Relisez les explications, une par une."]]}},{"id":"s6b","phase":"La confrontation","titre":"Le raccourci de Victor","type":"choice","lieu":"Grande table de rédaction, 12 h","scene":[["narr","Victor se lève, attrape le feutre et barre les trois colonnes d’un grand trait."],["victor","Simple : les trois documents disent que la fiction ment. Point final. On l’écrit, on boucle, et on va déjeuner. Je vous fais gagner vingt minutes."],["samuel","Sauf que Magritte AVOUE qu’il ment. Et que Diderot explique comment CACHER le mensonge. Ce n’est pas du tout la même chose."],["victor","Détails, détails… Le lecteur veut une idée forte, pas une thèse de doctorat."],["lina","Euh… Qui a raison ?"],["helene","Ce n’est pas à moi de trancher. C’est à l’équipe. Je veux une décision commune, et je veux savoir pourquoi."]],"consigne":"Votre équipe tranche. Prenez le temps d’en discuter avant de cliquer.","options":[{"id":"A","t":"Suivre Victor : une formule simple, efficace, et vingt minutes de gagnées.","eff":{"F":-2,"A":-2},"trust":{"victor":1,"samuel":-1},"flag":"suiviVictor","verdict":"risky","react":[["victor","Enfin des gens raisonnables ! On déjeune ?"],["samuel","…Je note. Mais une formule qui écrase les nuances, c’est une question 3 à 1 sur 4."],["helene","Le correcteur attend « dans quelle mesure », Victor. Pas « point final »."]],"expl":"Piège : « tous les documents disent la même chose » est la faute de confrontation la plus fréquente. La question 3 demande « dans quelle mesure » : elle appelle de la nuance."},{"id":"B","t":"Garder la nuance avec Samuel : on distingue le mensonge caché du mensonge avoué.","eff":{"A":2},"trust":{"samuel":1},"verdict":"positive","react":[["samuel","Merci. Tu verras, cette distinction va structurer toute la question 3."],["victor","Vous êtes d’un ennui… Je vais déjeuner seul."],["lina","Moi je reste. Je veux comprendre l’histoire du mensonge caché."]],"expl":"Bon choix : distinguer mensonge caché (Diderot) et mensonge avoué (Magritte, American Bluff) permet une réponse nuancée à la question 3."}]},{"id":"s7","phase":"La confrontation","titre":"L’axe du mensonge","type":"sliders","lieu":"Le tableau blanc, 12 h 15","scene":[["samuel","Puisqu’on a tranché, je vais vous montrer quelque chose."],["samuel","Même si vous avez suivi Victor, regardez cet axe. Vous verrez peut-être ce qui manquait.","flag:suiviVictor"],["samuel","Un axe. À gauche, le mensonge caché. À droite, le mensonge avoué. Placez chaque document."],["victor","Et notre faux témoignage, on le met où ?"],["samuel","Tout à gauche, Victor. Très, très à gauche."]],"consigne":"Déplacez chaque curseur à l’endroit qui correspond au document.","gauche":"Mensonge caché","droite":"Mensonge avoué","items":[{"doc":"Document 1 (Diderot)","zone":[0,35],"expl":"Caché : le conteur historique « se propose de vous tromper » et dissimule son art sous le détail vrai."},{"doc":"Document 2 (Slate)","zone":[30,70],"expl":"Au milieu : certains films cachent (Massacre à la tronçonneuse), d’autres avouent (American Bluff)."},{"doc":"Document 3 (Magritte)","zone":[65,100],"expl":"Avoué : l’inscription dit ouvertement que l’image n’est pas la chose."}],"bareme":{"jauge":"A","seuils":[[3,2],[2,1],[0,0]]},"react":{"good":[["samuel","Vous voyez la progression ? Du mensonge caché au mensonge avoué. C’est le fil de votre question 3."]],"mid":[["samuel","Presque. Regardez où se placent les documents dans la correction."]],"bad":[["samuel","Relisez la correction : cet axe, c’est votre question 3 en une image."]]}},{"id":"w3","phase":"La confrontation","titre":"Rédaction : question 3","type":"write","lieu":"Votre bureau, 12 h 30","scene":[["helene","La question 3, maintenant. « Dans quelle mesure » : je veux un oui, mais. Pas un oui tout court."],["helene","Et ne recopiez pas la formule de Victor. Le correcteur attend de la nuance.","flag:suiviVictor"],["samuel","Servez-vous de l’axe : du mensonge caché au mensonge avoué. C’est votre fil conducteur.","!flag:suiviVictor"],["lina","Après, je relis ma copie ? Pour ne pas laisser de fautes ?"],["helene","Bonne idée, Lina. Ça nous changera."]],"champs":["q3"]},{"id":"pause","phase":"Fin de la séance 1","titre":"On boucle la première partie","type":"pause","lieu":"Locaux de La Revue, 18 h 30","scene":[["narr","Les lampes de bureau s’allument une à une. Le compteur d’abonnés affiche {abonnes}."],["helene","Les questions sur corpus sont prêtes. Demain, l’éditorial : l’essai."],["victor","Je propose qu’on écrive l’édito ce soir, en une heure. J’ai déjà le titre : « LA FICTION MENT ! »"],["helene","Non. Demain, à tête reposée. Et sans point d’exclamation."],["lina","J’enregistre le brouillon, c’est ça ? Pour ne rien perdre d’ici demain ?"],["helene","Exactement. Tout le monde enregistre son brouillon. Celui qui l’oublie recommence tout."]]},{"id":"courrier","phase":"Le lendemain","titre":"Le courrier des lecteurs","type":"courrier","lieu":"Salle de rédaction, le lendemain, 8 h 45","scene":[["narr","Le site a publié hier soir un aperçu de vos réponses. Ce matin, une pile de lettres attend sur la grande table."],["lina","Il y a du courrier ! Je peux lire ?"],["helene","Lis. On apprend toujours plus des lecteurs que de nos propres compliments."]],"lettres":[{"de":"Marc, Lyon","txt":"Enfin une revue qui cite ses sources ligne par ligne. Je me réabonne.","cond":"F>=15"},{"de":"Annie, Rennes","txt":"Vos réponses résument les textes sans vraiment les comprendre. Où sont les preuves ?","cond":"F<12"},{"de":"Paul, Nantes","txt":"Lecture correcte du corpus, mais j’attends plus de précision dans les citations.","cond":"F>=12&&F<15"},{"de":"Un professeur de lettres","txt":"« Tous les documents disent que la fiction ment » ? Avez-vous seulement regardé le tableau de Magritte ?","cond":"flag:suiviVictor"},{"de":"Inès, Marseille","txt":"Merci d’avoir distingué le mensonge caché du mensonge avoué. Je n’avais jamais vu Magritte comme ça.","cond":"!flag:suiviVictor"},{"de":"L’association des lecteurs","txt":"Et l’éditorial, c’est pour quand ? Nous attendons de voir si vous avez compris la leçon."}],"fin":[["victor","Bah. Les lecteurs écrivent toujours quand ils sont mécontents.","F<12"],["victor","Bon. Ils aiment bien, apparemment. Ça ne durera pas.","F>=12"],["helene","Aujourd’hui, l’éditorial. C’est lui qu’on lira en premier."],["victor","Et c’est moi qui l’écris ?"],["helene","Non, Victor. Eux."]],"bouton":"Ouvrir la conférence de l’éditorial"},{"id":"s8","phase":"La une","titre":"Le choix de l’éditorial","type":"sujet","lieu":"Bureau d’Hélène, 9 h","scene":[["helene","Deux angles possibles pour l’éditorial. Choisissez celui sur lequel vous avez le plus à dire, pas celui qui paraît le plus facile."],["victor","Le deuxième ! Les marques, la pub, c’est votre métier, non ? Vous allez briller."],["samuel","Le premier mobilise mieux le corpus. Mais les deux se défendent, si on les relie aux documents."],["lina","Comment on choisit, alors ?"],["helene","On choisit celui pour lequel on a déjà des exemples en tête. Prenez deux minutes en équipe."]],"consigne":"Choisissez votre sujet d’essai. Ce choix est définitif pour la suite du numéro."},{"id":"s9","phase":"La une","titre":"La une : la problématique","type":"triage","lieu":"Bureau d’Hélène, 9 h 20","scene":[["narr","Quatre maquettes de une sont étalées sur le bureau d’Hélène. Sur l’une d’elles, Victor a ajouté au feutre : « LA FICTION MENT ! »."],["helene","Une seule de ces unes tient. Pour les trois autres, je veux savoir ce qui cloche. Pas « c’est nul » : POURQUOI c’est nul."],["victor","Et ma une à moi ?"],["helene","Ce n’est pas une question, Victor. C’est un slogan."]],"consigne":"Pour chaque problématique, indiquez votre verdict.","verdicts":["À la une","Trop large","Fermée (oui/non)","Hors sujet"],"items":{"1":[{"t":"L’émotion naît-elle de la vérité des faits, ou la fiction possède-t-elle un pouvoir propre de nous toucher ?","a":0},{"t":"Qu’est-ce que la vérité ?","a":1},{"t":"Les histoires vraies sont-elles plus touchantes ?","a":2},{"t":"Faut-il interdire les fausses informations sur Internet ?","a":3}],"2":[{"t":"Raconter une histoire pour vendre, est-ce forcément tromper, ou le récit peut-il transmettre une vérité de la marque ?","a":0},{"t":"La publicité est-elle mauvaise ?","a":1},{"t":"Les marques mentent-elles ?","a":2},{"t":"Comment créer une entreprise rentable ?","a":3}]},"ordre":{"1":[2,0,3,1],"2":[1,3,0,2]},"motsCles":{"1":[["vrai","vérit","authent","réel","fait"],["touch","émo","émeu","ému"]],"2":[["histoire","récit","storytelling","raconte"],["tromp","ment","mensonge","vend","client"]]},"react":{"good":[["helene","C’est notre une. Maintenant, reformulez-la avec vos propres mots : c’est elle qui ouvrira votre introduction."],["lina","Je la recopie en grand sur le tableau !"]],"bad":[["helene","Regardez cette maquette : le numéro part dans tous les sens. Une mauvaise problématique, et tout l’éditorial déraille."],["samuel","Et ça nous coûte un jeton de pistes. On recommence."]]}},{"id":"s10","phase":"Le chemin de fer","titre":"Le chemin de fer : le plan","type":"rank","lieu":"Atelier de maquette, 9 h 45","scene":[["lina","C’est quoi, un « chemin de fer » ? On part en train ?"],["helene","C’est l’ordre des pages d’un journal, Lina. On l’affiche au mur pour voir le numéro d’un coup d’œil. Pour un essai, c’est le plan."],["helene","Remettez les parties dans l’ordre, et écartez ce qui n’a rien à faire là. Un bon plan part de l’évidence, la discute, puis la dépasse."],["victor","Moi, je mets ma meilleure idée en premier. Après, on improvise."],["samuel","Et le lecteur décroche à la page deux."]],"consigne":"Classez les parties dans l’ordre (flèches) et écartez l’intrus.","react":{"good":[["helene","Un chemin de fer solide : on part de l’évidence, on la discute, puis on la dépasse."],["lina","Thèse, nuance, dépassement… Je le colle au-dessus de mon bureau."]],"mid":[["helene","L’ordre n’est pas encore le bon. Regardez la logique : on part de l’évidence, on la discute, on dépasse."]],"bad":[["helene","Ce plan ne progresse pas. Étudiez le plan attendu : vous allez le suivre."]]}},{"id":"s11","phase":"Le chemin de fer","titre":"Arguments et exemples du corpus","type":"match2","lieu":"Atelier de maquette, 10 h","scene":[["samuel","Chaque argument a besoin de sa preuve. Le corpus en contient déjà plusieurs."],["samuel","Associe chaque exemple tiré du corpus à l’idée qu’il illustre. Rappel important : dans l’essai, UN SEUL document du corpus peut te servir d’exemple."],["lina","Pourquoi un seul ?"],["samuel","Parce que le correcteur veut voir TA culture, pas seulement le corpus qu’il t’a donné."]],"consigne":"Associez chaque exemple à l’idée qu’il illustre.","items":[{"q":"La verrue et la poussière sur les souliers (doc. 1)","a":"Le détail concret crée l’illusion du vrai"},{"q":"Les scènes inventées de Fruitvale Station (doc. 2)","a":"L’invention peut servir l’émotion et la vérité du personnage"},{"q":"« Some of this actually happened » (doc. 2)","a":"Une œuvre peut être honnête sur sa part de fiction"},{"q":"Massacre à la tronçonneuse vendu comme vrai (doc. 2)","a":"L’étiquette « vrai » peut n’être qu’un argument de vente"},{"q":"« Ceci n’est pas une pipe » (doc. 3)","a":"Toute représentation est une illusion qu’on peut dévoiler"}],"bareme":{"jauge":"F","seuils":[[5,2],[3,1],[0,0]]},"react":{"good":[["samuel","Parfait. Choisis maintenant LE document du corpus que tu utiliseras dans ton essai."]],"mid":[["samuel","Quelques erreurs. Relis la correction."]],"bad":[["samuel","Reprends la correction : un exemple mal rattaché à son idée ne prouve rien."]]}},{"id":"s12","phase":"Le chemin de fer","titre":"Vrai ou toc ?","type":"sort","lieu":"Atelier de maquette, 10 h 15","scene":[["narr","Victor déboule avec une pile de fiches cornées."],["victor","Des exemples, j’en ai des dizaines ! Prenez les miens, ils sont excellents. Je les utilise depuis quinze ans."],["samuel","Trions-les. Un bon exemple est identifié (titre, auteur, date) ET exploité : on explique ce qu’il prouve."],["victor","Exploité, exploité… Un bon exemple parle de lui-même !"],["helene","Non. Un exemple qui « parle de lui-même », c’est un exemple que le correcteur doit interpréter à votre place."]],"consigne":"Classez chaque exemple : « Vrai » (bon exemple) ou « Toc » (faux bon exemple).","ordre":[1,4,0,3,2],"items":[{"t":"« De nos jours, beaucoup de films racontent des histoires vraies. »","a":"toc","expl":"Vague, aucune œuvre précise : cela ne prouve rien."},{"t":"« Dans un film que j’ai vu l’an dernier, le héros meurt à la fin et c’est triste. »","a":"toc","expl":"Ni titre, ni date, ni analyse : le correcteur ne peut rien vérifier."},{"t":"« Dans Titanic, un film de 1997. »","a":"toc","expl":"Identifié, mais simplement mentionné : il manque l’analyse (que montre-t-il ?)."},{"t":"« Tout le monde sait qu’Einstein était mauvais en mathématiques à l’école. »","a":"toc","expl":"Anecdote célèbre… et fausse. « Tout le monde sait » n’est pas une source : il faut vérifier."},{"t":"« Dans un roman social du XIXe siècle (titre, auteur, date), le romancier invente une ouvrière dont la misère bouleverse le lecteur : cela montre qu’une fiction vraisemblable suffit à émouvoir. »","a":"vrai","expl":"Bonne structure : identification précise + ce que l’exemple démontre en lien avec le sujet."}],"bareme":{"jauge":"C","seuils":[[5,2],[4,1],[0,0]]},"react":{"good":[["samuel","Tu sais reconnaître un exemple solide. Maintenant, va chercher les tiens."],["victor","Einstein n’était pas mauvais en maths ? Mais… on me l’a toujours raconté !"],["samuel","Justement, Victor."]],"mid":[["samuel","Attention aux exemples « mentionnés » mais pas exploités : c’est le défaut le plus fréquent."]],"bad":[["victor","Ils étaient très bien, mes exemples !"],["samuel","Non, Victor. Relis la correction, et toi aussi."]]}},{"id":"s13","phase":"Le chemin de fer","titre":"Le carnet de pistes de Samuel","type":"research","lieu":"Le centre de documentation, 10 h 30","scene":[["samuel","Je ne te donnerai aucun titre. Je t’indique où chercher. Chaque indice plus précis te coûte des jetons ; les jetons non dépensés seront récompensés."],["victor","Moi, je demande à une IA, ça va plus vite."],["samuel","Une IA peut t’inventer une référence de toutes pièces, avec une date et un auteur très crédibles. On sort d’un faux témoignage, Victor. On vérifie tout, dans deux sources."],["lina","Et si je trouve un exemple sur un réseau social ?"],["samuel","Tu le vérifies ailleurs. Un réseau social seul, ce n’est pas une source."],["helene","Huit minutes par référence, environ. On boucle à midi."]],"consigne":"Pour chaque paragraphe de votre essai, trouvez une référence culturelle (Internet autorisé), puis remplissez sa fiche. Au moins une fiche validée par partie pour continuer.","jetons":6,"minuteur":8},{"id":"wi","phase":"L’éditorial","titre":"Rédaction : l’introduction","type":"write","champs":["intro"],"lieu":"Votre bureau, 11 h 30","scene":[["helene","L’introduction, en quatre temps : une accroche, la présentation du sujet et de ses termes, la problématique, l’annonce du plan."],["lina","L’accroche, c’est une blague pour attirer le lecteur ?"],["helene","Non : un fait, une œuvre, une situation qui mène droit au sujet. Une de vos références peut très bien servir."],["victor","Commencez par « Depuis la nuit des temps… ». Ça marche toujours."],["samuel","Ça ne marche jamais, Victor. Les correcteurs le soulignent en rouge."]]},{"id":"wd","phase":"L’éditorial","titre":"Rédaction : le développement","type":"write","champs":["dev"],"lieu":"Votre bureau, 12 h","scene":[["helene","Chaque paragraphe : un argument, un exemple, une analyse qui relie l’exemple au sujet."],["samuel","Vos fiches ont pré-rempli les exemples. Ne les recopiez pas bêtement : reformulez-les pour qu’ils entrent dans votre phrase."],["lina","Et l’analyse, c’est quoi exactement ?"],["samuel","C’est répondre à « et alors ? ». Tu as donné un exemple : qu’est-ce qu’il prouve, pour ton sujet ?"]]},{"id":"wc","phase":"L’éditorial","titre":"Rédaction : la conclusion","type":"write","champs":["concl"],"lieu":"Votre bureau, 13 h 30","scene":[["victor","Une conclusion, c’est la morale de l’histoire. « Et ils vécurent heureux. »"],["helene","Non. Un bilan qui répond clairement à la problématique, puis une ouverture. Pas d’argument nouveau."],["lina","L’ouverture, c’est une nouvelle question ?"],["helene","Une question voisine, que votre réflexion fait naître. Pas un nouveau sujet."]]},{"id":"s14","phase":"Le bouclage","titre":"Le premier jet de Lina","type":"spot","lieu":"Bureau de Lina, 14 h","scene":[["narr","Lina vous tend timidement une feuille, déjà froissée à force d’avoir été relue."],["lina","J’ai écrit un paragraphe pour m’entraîner… Hélène dit qu’il y a six erreurs. Je n’en trouve que deux."],["victor","Six erreurs en quatre lignes ? Respect, Lina."],["helene","Victor, rappelle-moi combien de fautes il y avait dans ta dernière chronique ?"],["lina","Tu peux m’aider à les trouver ? Je veux m’en souvenir pour mes vraies copies."]],"consigne":"Cliquez sur les six passages fautifs, puis validez.","multi":true,"segments":[{"t":"Du coup, on peut dire que","err":true,"expl":"Tic de langage oral : à supprimer."},{"t":" les histoires vraies "},{"t":"touche","err":true,"expl":"Accord : « les histoires vraies touchent »."},{"t":" plus le public. "},{"t":"Par exemple dans un film que j’ai vu,","err":true,"expl":"Exemple non identifié : titre, réalisateur, date."},{"t":" le héros meurt à la fin et "},{"t":"c’était trop triste.","err":true,"expl":"Registre familier (« trop ») et jugement sans analyse."},{"t":" "},{"t":"Comme dit Diderot on n’invente pas ces choses-là.","err":true,"expl":"Citation sans guillemets ni référence au document."},{"t":" "},{"t":"Donc","err":true,"expl":"Connecteur faux : l’idée s’oppose à la précédente, il faut « Pourtant »."},{"t":" la fiction peut aussi émouvoir le spectateur."}],"bareme":{"jauge":"P","parBonne":0.5,"parFausse":-0.25},"react":{"good":[["lina","Les six ! Merci… Je vais relire ma propre copie avec ces yeux-là."],["helene","Toi aussi, d’ailleurs. Ces six erreurs sont les plus fréquentes dans les copies de BTS."]],"mid":[["lina","Il en reste… Je regarde la correction. Tu devrais relire ta copie avec cette liste."]],"bad":[["lina","On en a raté beaucoup. Hélène va me renvoyer à la photocopieuse…"]]}},{"id":"s15","phase":"Le bouclage","titre":"Les liens logiques","type":"cloze","lieu":"Bureau de Lina, 14 h 15","scene":[["helene","Dernier contrôle : les connecteurs. Un mauvais connecteur, et votre raisonnement dit le contraire de ce que vous pensez."],["lina","Comme mon « donc » à la place de « pourtant » ?"],["helene","Exactement comme ça."]],"consigne":"Choisissez le connecteur qui convient dans chaque trou.","choix":["Ainsi","Certes","En effet","Pourtant"],"texte":[""," une histoire vraie possède une force particulière. "," la fiction nous émeut tout autant. ",", le lecteur ne demande pas que les faits aient eu lieu, mais qu’ils soient vraisemblables. ",", c’est la vérité humaine du récit qui nous touche."],"reponses":["Certes","Pourtant","En effet","Ainsi"],"bareme":{"jauge":"P","seuils":[[4,2],[3,1],[0,0]]},"react":{"good":[["helene","Concession, opposition, explication, conclusion : le squelette d’un bon raisonnement."]],"mid":[["helene","Presque. Relisez la logique de chaque phrase."]],"bad":[["helene","Relisez la correction : ces quatre connecteurs sont ceux de votre essai."]]}},{"id":"s16","phase":"Le bouclage","titre":"Relecture et bouclage","type":"review","lieu":"Bureau d’Hélène, 14 h 30","scene":[["narr","L’imprimerie a appelé deux fois. Le compteur d’abonnés affiche {abonnes}."],["helene","Relisez tout. Le correcteur de Lina signale ce qui peut l’être ; le reste, c’est votre œil."],["lina","J’ai programmé un petit correcteur ! Il repère les tics de langage et les citations sans guillemets."],["samuel","Vérifiez aussi vos numéros de lignes. Une citation sans ligne, c’est une citation que le correcteur doit chercher lui-même."],["helene","Quand vous exportez, la copie part à l’impression. Vous ne pourrez plus la modifier."]]}],"rangs":[{"min":65,"nom":"Numéro de référence","txt":"Les abonnés reviennent en masse. Le numéro est cité par d’autres revues : La Revue est sauvée, et grandie."},{"min":50,"nom":"Numéro remarqué","txt":"Le numéro est salué. Les désabonnements s’arrêtent : La Revue est sauvée, de justesse."},{"min":35,"nom":"Numéro honnête","txt":"La Revue survit. Hélène dresse la liste de ce qu’il faudra améliorer au prochain numéro."},{"min":0,"nom":"Numéro au pilon","txt":"Le numéro part au pilon. Victor propose déjà un nouveau « témoignage »…"}],"grille":{"questions":["Ma lecture des documents est juste (pas de contresens).","Mes réponses s’appuient sur des citations précises, avec les lignes.","À la question 1 et à la question 3, je confronte vraiment (points communs ET différences).","J’explique le paradoxe du tableau ET je le résous.","Mon expression est correcte et claire."],"essai":["Ma problématique est claire et reprend les termes du sujet.","Mon plan est structuré et progresse vers une réponse nuancée.","Chaque paragraphe contient un argument développé.","Mes exemples sont précis (titre, auteur, date) ET exploités.","Mes références sont variées et vérifiées.","Mon introduction et ma conclusion sont complètes.","Mon expression est correcte (syntaxe, orthographe, registre, connecteurs)."]},"tics":["du coup","de nos jours","on peut dire que","trop bien","trop triste","c'est trop","c’est trop","carrément","en gros","voilà","bref,","y'a","y’a","kiffer"]};
