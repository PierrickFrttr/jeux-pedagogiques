const fr = n => String(Math.round(n*100)/100).replace(".",",");
function clamp(v){ return Math.max(0, Math.min(20, Math.round(v*100)/100)); }
function words(t){ return (String(t||"").trim().match(/[^\s]+/g)||[]).length; }
function seeded(arr, seed){ const a=arr.slice(); let s=seed; for(let i=a.length-1;i>0;i--){ s=(s*9301+49297)%233280; const j=Math.floor(s/233280*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function hash(str){ let h=5381; for(const c of String(str).trim().toUpperCase()) h=((h<<5)+h+c.charCodeAt(0))|0; return h; }
function slug(s){ return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"") || "eleve"; }
function stamp(){ const d=new Date(), p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`; }
function hhmm(){ const d=new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }

function applyEff(eff, label){
  const parts=[];
  for(const k of Object.keys(eff||{})){ const v=eff[k]; if(!v) continue; S.gauges[k]=clamp(S.gauges[k]+v); parts.push({k,v}); }
  if(parts.length) S.log.push({label, eff:parts});
  flashGauges(parts.map(p=>p.k));
  return parts;
}
function applyTrust(tr){ for(const k of Object.keys(tr||{})) S.trust[k]=Math.max(0,Math.min(3,S.trust[k]+tr[k])); }
function effHtml(parts){

  return `<div class="effs">${parts.map(p=>`<span class="eff ${p.v>0?"p":"n"}">${nm[p.k]} ${p.v>0?"+":""}${fr(p.v)}</span>`).join("")}</div>`;

function evalCond(c){
  if(!c) return true;
  return c.split("&&").every(raw=>{ const p=raw.trim(); let neg=false, x=p; if(x.startsWith("!")){ neg=true; x=x.slice(1); }
    let ok;

    return neg?!ok:ok; });
}

    return `<div class="dcard"><h4>Document ${d}</h4><div style="font-size:12px;color:var(--lead);margin-bottom:6px">${["Diderot","Slate (A. Bordages)","Magritte"][d-1]}</div>
      ${st.slots.map((sl,k)=>{ const key=d+"-"+k, ti=place[key]; let cls="slot";
        if(done){ cls += (ti!==undefined && st.tags[ti].doc===d && st.tags[ti].slot===k) ? " good":" bad"; }
        return `<div class="${cls}" data-k="${key}"><span class="sl">${esc(sl)}</span>${ti!==undefined?`<span class="tag" data-t="${ti}" data-placed="1">${esc(st.tags[ti].t)}</span>`:""}</div>`; }).join("")}</div>`;
  }).join("");
  let corr="";
  if(done){
    corr = `<div class="meth" style="margin-top:12px"><b>Correction :</b><ul>${[1,2,3].map(d=>`<li>Document ${d} : ${st.tags.filter(t=>t.doc===d).sort((a,b)=>a.slot-b.slot).map(t=>esc(t.t)).join(" · ")}</li>`).join("")}</ul></div>`;
    const pm = Object.values(place).map(i=>st.tags[i]).filter(t=>t.piege&&t.msg);
    if(pm.length) corr += lines(pm.map(t=>["samuel",t.msg]));
  }
  act.innerHTML = `<div class="panel"><div class="tape"></div><p class="consigne">${esc(st.consigne)}</p>
    ${done?"":`<div class="pool" id="pool" data-k="pool">${pool||'<span style="color:var(--lead);font-size:13px">Toutes les étiquettes sont placées.</span>'}</div>`}
    <div class="docs3">${docs}</div>${corr}
    ${done?doneFb(st,done)+nextBtn():`<div class="actions"><button class="btn" id="tVal">Valider</button><button class="btn ghost" id="tReset">Tout retirer</button></div>`}</div>`;
  if(done){ bindNext(); return; }
  let sel=null;
  const putTag=(ti,key)=>{ for(const k of Object.keys(place)) if(place[k]===ti) delete place[k]; if(key!=="pool") place[key]=ti; RENDER.tags(st,act,null); };
  $$(".tag",act).forEach(t=>{
    t.onclick=e=>{ e.stopPropagation(); const ti=+t.dataset.t; if(t.dataset.placed){ putTag(ti,"pool"); return; } $$(".tag",act).forEach(x=>x.classList.remove("sel")); if(sel===ti){ sel=null; return; } sel=ti; t.classList.add("sel"); };
    t.ondragstart=e=>{ e.dataTransfer.setData("text/plain", t.dataset.t); };
  });
  $$(".slot",act).forEach(s=>{
    s.onclick=()=>{ if(sel===null) return; putTag(sel, s.dataset.k); };
    s.ondragover=e=>{ e.preventDefault(); s.classList.add("over"); };
    s.ondragleave=()=>s.classList.remove("over");
    s.ondrop=e=>{ e.preventDefault(); putTag(+e.dataTransfer.getData("text/plain"), s.dataset.k); };
  });
  const pl=$("#pool"); if(pl){ pl.ondragover=e=>e.preventDefault(); pl.ondrop=e=>{ e.preventDefault(); putTag(+e.dataTransfer.getData("text/plain"),"pool"); }; }
  $("#tReset").onclick=()=>{ for(const k of Object.keys(place)) delete place[k]; RENDER.tags(st,act,null); };
  $("#tVal").onclick=()=>{
    if(Object.keys(place).length<9){ toast("Remplissez les neuf cases avant de valider."); return; }
    let n=0; for(const [k,ti] of Object.entries(place)){ const [d,sl]=k.split("-").map(Number); const t=st.tags[ti]; if(t.doc===d&&t.slot===sl) n++; }
    const pts=tierFrom(n, st.bareme.seuils), tier=tierName(pts);
    const parts=applyEff({[st.bareme.jauge]:pts}, st.titre);
    finishStep(st,{place:Object.assign({},place), score:n+"/9"}, tier, parts); render();
  };
};

// highlight
RENDER.highlight = (st, act, done) => {
  const sel = done ? done.sel : (S._hl && S._hl.id===st.id ? S._hl.s : []);
  S._hl={id:st.id, s:sel};
  act.innerHTML = `<div class="panel"><div class="tape"></div><p class="consigne">${esc(st.consigne)}</p>
    <p style="font-size:14px;color:var(--lead);margin-top:-8px">Extraits du document 1. <button class="linkbtn" id="hlDoc">Relire le texte complet</button></p>
    ${(st.ordre||st.phrases.map((_,k)=>k)).map(i=>{ const p=st.phrases[i]; let c="extract"+(sel.includes(i)?" on":""); if(done){ if(p.ok) c+=" good"; else if(sel.includes(i)) c+=" bad"; }
      return `<div class="${c}" data-i="${i}" tabindex="0">${esc(p.t)}${done?`<span class="x">${p.ok?"À surligner : ":(sel.includes(i)?"Erreur : ":"")}${esc(p.expl)}</span>`:""}</div>`; }).join("")}
    ${done?doneFb(st,done)+nextBtn():`<div class="actions"><button class="btn" id="hVal">Valider (${sel.length}/${st.max})</button></div>`}</div>`;
  $("#hlDoc").onclick=()=>openCorpus(1);
  if(done){ bindNext(); return; }
  $$(".extract",act).forEach(e=>{ const f=()=>{ const i=+e.dataset.i; const k=sel.indexOf(i); if(k>=0) sel.splice(k,1); else { if(sel.length>=st.max){ toast("Deux passages maximum : retirez-en un d’abord."); return; } sel.push(i); } RENDER.highlight(st,act,null); }; e.onclick=f; e.onkeydown=ev=>{ if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); f(); } }; });
  $("#hVal").onclick=()=>{

    const parts=applyEff({F:pts}, st.titre); if(ok===2) applyTrust({samuel:1});
    finishStep(st,{sel:sel.slice(), score:ok+"/2 passages justes"}, tier, parts); render();
  };
};

// spot (single or multi)
RENDER.spot = (st, act, done) => {
  const key="_sp_"+st.id; const sel = done ? done.sel : (S[key]||(S[key]=[]));
  const nErr = st.segments.filter(s=>s.err).length;
  const txt = st.segments.map((s,i)=>{
    if(!s.t.trim()) return esc(s.t);
    let c="seg"+(sel.includes(i)?" on":"");
    if(done){ if(s.err && sel.includes(i)) c="seg err on"; else if(s.err) c="seg err miss"; else if(sel.includes(i)) c="seg fp"; }
    return `<span class="${c}" data-i="${i}" ${done?"":'tabindex="0"'}>${esc(s.t)}</span>`;
  }).join("");
  let corr="";
  if(done) corr = `<ul class="errlist">${st.segments.filter(s=>s.err).map(s=>`<li><b>« ${esc(s.t.trim())} »</b> : ${esc(s.expl)}</li>`).join("")}</ul>`;
  act.innerHTML = `<div class="panel"><div class="tape"></div><p class="consigne">${esc(st.consigne)}</p><div class="spottext">${txt}</div>${corr}
    ${done?doneFb(st,done)+nextBtn():`<div class="actions"><button class="btn" id="spVal">Valider${st.multi?` (${sel.length} sélectionné${sel.length>1?"s":""})`:""}</button></div>`}</div>`;
  if(done){ bindNext(); return; }
  $$(".seg[data-i]",act).forEach(e=>{ const f=()=>{ const i=+e.dataset.i; const k=sel.indexOf(i); if(k>=0) sel.splice(k,1); else { if(!st.multi) sel.length=0; sel.push(i); } RENDER.spot(st,act,null); }; e.onclick=f; e.onkeydown=ev=>{ if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); f(); } }; });
  $("#spVal").onclick=()=>{
    if(!sel.length){ toast("Cliquez d’abord sur un passage."); return; }
    const good=sel.filter(i=>st.segments[i].err).length, bad=sel.length-good;
    let pts, tier, score;
    if(!st.multi){ pts = good? st.bareme.juste : st.bareme.faux; tier = good?"good":"bad"; score = good?"phrase fautive trouvée":"mauvaise phrase"; }
    else { pts = Math.round((good*st.bareme.parBonne + bad*st.bareme.parFausse)*100)/100; tier = good===nErr&&bad===0?"good":(good>=nErr/2?"mid":"bad"); score = `${good}/${nErr} erreurs trouvées`+(bad?`, ${bad} fausse${bad>1?"s":""} alerte${bad>1?"s":""}`:""); if(good===nErr) applyTrust({lina:1}); }
    const parts=applyEff({[st.bareme.jauge]:pts}, st.titre);
    finishStep(st,{sel:sel.slice(), score}, tier, parts); render();
  };
};

  const rep = done ? done.rep : (S._hs||(S._hs={}));

  const img = DATA.docs[2].img;
  const svg = `<figure class="tableau"><div class="tw">
      ${img?`<img src="${img}" alt="René Magritte, La Trahison des images, 1929">`:`<div class="noimg">Reproduction non disponible</div>`}
      <button class="zone zfond" data-z="z3" aria-label="Zone C : le fond"><span class="zl">C</span></button>
      <button class="zone zobj" data-z="z1" aria-label="Zone A : l’objet représenté"><span class="zl">A</span></button>
      <button class="zone zins" data-z="z2" aria-label="Zone B : l’inscription"><span class="zl">B</span></button>
    </div>
    <button class="zone cartel" data-z="z4" aria-label="Zone D : le cartel"><span class="zl">D</span><b>René Magritte</b> (1898-1967)<br><i>La Trahison des images (Ceci n’est pas une pipe)</i>, 1929<br>Huile sur toile, 60,3 × 81,1 cm · LACMA</button></figure>`;
  const active = S._hsA || st.zones[0].id;
  const rows = st.zones.map((z,i)=>{
    const ok = done && rep[z.id]===z.a;
    return `<div class="zrow ${!done&&active===z.id?"on":""}" id="zr_${z.id}" data-z="${z.id}" ${done?"":'tabindex="0"'}><label>Zone ${"ABCD"[i]} · ${esc(z.nom)}</label>
    <div class="chosen">${rep[z.id]?esc(rep[z.id]):'<span style="color:#9aa3ae">Aucun procédé choisi</span>'}</div>
    ${done?`<div class="corr" style="margin-top:4px">${ok?"Juste.":"Attendu : "+esc(z.a)}</div>`:""}</div>`;
  }).join("");
  const used = new Set(Object.values(rep));
  const pal = done ? "" : `<div class="caseL">Procédés : choisissez celui de la zone ${"ABCD"[st.zones.findIndex(z=>z.id===active)]}</div><div class="pal">${opts.map(o=>`<button data-p="${esc(o)}" class="${used.has(o)?"used":""}">${esc(o)}</button>`).join("")}</div>`;
  act.innerHTML = `<div class="panel"><div class="tape"></div><p class="consigne">${esc(st.consigne)}</p>
    <div class="hs"><div>${svg}${pal}</div><div>${rows}</div></div>
    ${done?doneFb(st,done)+nextBtn():`<div class="actions"><button class="btn" id="hsVal">Valider</button></div>`}</div>`;
  if(done){ st.zones.forEach(z=>$("#zr_"+z.id).style.background = rep[z.id]===z.a?"var(--okbg)":"var(--kobg)"); bindNext(); return; }
  $$(".zone",act).forEach(z=>{ z.classList.toggle("on", z.dataset.z===active); z.onclick=()=>{ S._hsA=z.dataset.z; RENDER.hotspot(st,act,null); }; });
  $$(".zrow",act).forEach(r=>{ const f=()=>{ S._hsA=r.dataset.z; RENDER.hotspot(st,act,null); }; r.onclick=f; r.onkeydown=ev=>{ if(ev.key==="Enter") f(); }; });
  $$(".pal button",act).forEach(b=>b.onclick=()=>{ const p=b.dataset.p; for(const k of Object.keys(rep)) if(rep[k]===p) delete rep[k]; rep[active]=p; const i=st.zones.findIndex(z=>z.id===active); const nxt=st.zones.find((z,k)=>k>i && !rep[z.id]) || st.zones.find(z=>!rep[z.id]); if(nxt) S._hsA=nxt.id; RENDER.hotspot(st,act,null); });
  $("#hsVal").onclick=()=>{
    if(st.zones.some(z=>!rep[z.id])){ toast("Associez un procédé à chacune des quatre zones."); return; }

    const parts=applyEff({F:pts}, st.titre);
    finishStep(st,{rep:Object.assign({},rep), score:n+"/4 zones"}, tier, parts); render();
  };
};

// triage (problematique)
RENDER.triage = (st, act, done) => {
  const items = st.items[S.sujet];
  const T = S._tri && S._tri.s===S.sujet ? S._tri : (S._tri={s:S.sujet, rep:{}, essais:0, wrong:[]});
  const rep = done ? done.rep : T.rep;
  const allOk = done || false;
  const reform = S.copy.intro.problematique || (done && done.reform) || "";
  const mk = st.motsCles[S.sujet];
  const checks = t => { const l=t.toLowerCase(); return [
    ["C’est une question (elle se termine par « ? »)", /\?\s*$/.test(t.trim())],
    ["Elle reprend la première notion du sujet", mk[0].some(k=>l.includes(k))],
    ["Elle reprend la seconde notion du sujet", mk[1].some(k=>l.includes(k))],
    ["Elle fait apparaître une tension (« ou », « mais », « pourtant », « forcément »…)", /\b(ou|mais|pourtant|forcément|toujours|seulement|suffit|nécessaire)\b/i.test(t)],
    ["Elle est assez développée (au moins 10 mots)", words(t)>=10]]; };
  const checkHtml = t => `<ul class="checklist">${checks(t).map(([l,ok])=>`<li class="${ok?"y":""}">${esc(l)}</li>`).join("")}</ul>`;
  act.innerHTML = `<div class="panel"><div class="tape"></div><p class="consigne">${esc(st.consigne)}</p>
    <div class="qbox"><div class="ql">Sujet ${S.sujet}</div><div class="qt">${esc(DATA.sujets[S.sujet-1].texte)}</div></div>
    ${(st.ordre?st.ordre[S.sujet]:items.map((_,k)=>k)).map(i=>items[i]).map((it,_j,_a,i=items.indexOf(it))=>`<div class="mrow ${done||T.wrong.length?(rep[i]===it.a?(done||T.essais?"good":""):(T.wrong.includes(i)?"bad":"")):""}"><div style="font-family:var(--serif)">${esc(it.t)}</div>
      <select id="tr${i}" ${done?"disabled":""}><option value="">Verdict…</option>${st.verdicts.map((v,k)=>`<option value="${k}" ${rep[i]===k?"selected":""}>${esc(v)}</option>`).join("")}</select></div>`).join("")}
    <div id="trFb">${T.lastBad?lines(st.react.bad)+fbBox("bad",`Au moins un verdict est faux (lignes en rouge). Corrigez-les.${effHtml(T.lastEff)}`):""}</div>
    ${done?`${fbBox(done.tier,`<b>${done.essais===1?"Trouvé du premier coup.":"Trouvé en "+done.essais+" essais."}</b>${effHtml(done.eff)}`)}${lines(st.react.good)}
      <div class="caseL">Votre problématique, reformulée avec vos mots</div><div class="caseH">Elle sera placée dans votre introduction (vous pourrez encore la modifier).</div>
      <textarea class="w sm nopaste" id="reform" ${S.locked?"readonly":""}>${esc(reform)}</textarea><div id="reCheck">${checkHtml(reform)}</div>${nextBtn()}`
    :`<div class="actions"><button class="btn" id="trVal">Valider les verdicts</button></div>`}</div>`;
  if(done){
    const ta=$("#reform"); ta.oninput=()=>{ S.copy.intro.problematique=ta.value; $("#reCheck").innerHTML=checkHtml(ta.value); markDirty(); };
    bindNext(()=>{ if(!ta.value.trim()){ toast("Reformulez la problématique avant de continuer."); return false; } }); return;
  }
  items.forEach((_,i)=>{ $("#tr"+i).onchange=e=>{ T.rep[i]= e.target.value===""?undefined:+e.target.value; }; });
  $("#trVal").onclick=()=>{
    if(items.some((_,i)=>T.rep[i]===undefined)){ toast("Donnez un verdict pour chaque proposition."); return; }
    T.essais++;
    T.wrong = items.map((it,i)=>T.rep[i]===it.a?-1:i).filter(i=>i>=0);
    if(T.wrong.length){
      T.lastBad=true; T.lastEff=null;
      if(!T.penalized){ T.penalized=true; let eff={A:-1}; T.lastEff=applyEff(eff, "Problématique ratée"); if(S.jetons>0){ S.jetons--; S.log.push({label:"Problématique ratée : 1 jeton perdu", eff:[]}); } }
      markDirty(); render(); return;
    }
    const pts = T.essais===1?2:0; const parts=applyEff({A:pts}, st.titre); if(T.essais===1) applyTrust({helene:1});
    if(!S.copy.intro.problematique) S.copy.intro.problematique = items[0].t;
    finishStep(st,{rep:Object.assign({},T.rep), essais:T.essais, score: T.essais===1?"premier essai":T.essais+" essais"}, T.essais===1?"good":"mid", parts); T.lastBad=false; render();
  };
};

// rank (plan)
RENDER.rank = (st, act, done) => {
  const P = DATA.plans[S.sujet];
  const R = done ? done : (S._rk && S._rk.s===S.sujet ? S._rk : (S._rk={s:S.sujet, order:["p2","x","p3","p1"], out:[]}));
  const bloc = id => P.blocs.find(b=>b.id===id);
  let pos=0;
  act.innerHTML = `<div class="panel"><div class="tape"></div><p class="consigne">${esc(st.consigne)}</p>
    <ul class="rank">${R.order.map((id,i)=>{ const out=R.out.includes(id); if(!out) pos++; return `<li class="${out?"out":""}"><span class="pos">${out?"–":["I","II","III","IV"][pos-1]}</span><span class="tx">${esc(bloc(id).txt)}</span>
      ${done?"":`<button data-u="${i}" aria-label="Monter">↑</button><button data-d="${i}" aria-label="Descendre">↓</button><button data-x="${id}">${out?"Réintégrer":"Écarter"}</button>`}</li>`; }).join("")}</ul>
    ${done?`<div class="meth"><b>Plan attendu :</b><ol>${P.ordre.map((id,i)=>`<li><b>${esc(P.titres[i])}</b> : ${esc(bloc(id).txt)}</li>`).join("")}</ol>Intrus : « ${esc(P.blocs.find(b=>b.intrus).txt)} » (hors sujet). Votre essai suivra ce plan ; vous rédigerez vos propres arguments.</div>${doneFb(st,done)}${nextBtn()}`
      :`<div class="actions"><button class="btn" id="rkVal">Valider le plan</button></div>`}</div>`;

  $("#rkVal").onclick=()=>{
    const kept=R.order.filter(id=>!R.out.includes(id));

    let pts=0, sc=[];
    const intrusOk = R.out.includes("x"); if(intrusOk){ pts+=1; sc.push("intrus écarté"); } else sc.push("intrus gardé");
    if(kept.join()===P.ordre.join()){ pts+=3; sc.push("ordre exact"); }
    else if(kept[2]==="p3" && intrusOk){ pts+=1; sc.push("synthèse bien placée en III"); }
    else sc.push("ordre à revoir");
    const tier = pts>=4?"good":(pts>=2?"mid":"bad");
    const parts=applyEff({A:pts}, st.titre);
    finishStep(st,{order:R.order.slice(), out:R.out.slice(), s:S.sujet, score:sc.join(", ")}, tier, parts);
    render();
  };
};

// ---------------- RESEARCH ----------------

        <div style="margin:10px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap">${f.t0?`<span>Minuteur indicatif : <span class="timer" id="tm_${k}">--:--</span></span>`:(ro?"":`<button class="btn ghost" data-t0="${k}">Lancer le minuteur (${st.minuteur} min)</button>`)}</div>

function startTimer(k, min){
  clearInterval(timers[k]);
  const tick=()=>{ const el=$("#tm_"+k); if(!el){ clearInterval(timers[k]); return; } const f=S.fiches[k]; const left=min*60-Math.floor((Date.now()-f.t0)/1000); const a=Math.abs(left); el.textContent=(left<0?"+":"")+String(Math.floor(a/60)).padStart(2,"0")+":"+String(a%60).padStart(2,"0"); el.classList.toggle("over", left<0); if(left<0 && !f._warned){ f._warned=true; toast("Hélène : « On boucle dans une heure ! » Le temps indicatif de cette recherche est dépassé."); } };
  tick(); timers[k]=setInterval(tick,1000);
}
function validateFiche(k){
  const f=getFiche(k), msgs=[];
  const miss=[]; if(!f.titre.trim()) miss.push("le titre"); if(!f.auteur.trim()) miss.push("l’auteur ou l’acteur"); if(!f.date.trim()) miss.push("la date");
  if(miss.length){ const m = miss.includes("la date") ? "Un exemple sans date, c’est une rumeur." : "Un exemple qu’on ne peut pas identifier ne prouve rien."; setFb(k, lines([["samuel", m+" Il manque : "+miss.join(", ")+"."]])); return; }
  if(words(f.resume)<8){ setFb(k, lines([["samuel","Raconte-moi en deux vraies phrases ce que c’est. Au moins huit mots."]])); return; }
  if(words(f.lien)<8){ setFb(k, lines([["samuel","Et le lien avec l’argument ? Un exemple non exploité, c’est un « toc ». Au moins huit mots."]])); return; }
  if(!f.domaine||!f.typeSource||!f.verif){ setFb(k, lines([["samuel","Complète le domaine, le type de source et la vérification."]])); return; }
  if(words(f.samuel)<8){ setFb(k, lines([["samuel","Réponds à ma question en quelques phrases : je veux savoir ce que TU as compris."]])); return; }
  const corpusN = Object.values(S.fiches).filter(x=>x.valide&&x.corpus).length + (f.corpus?1:0);
  f.valide=true;
  let eff={}, out=[];
  if(!f.applied){
    f.applied=true;
    const fiable = /^(Site institutionnel|Encyclopédie|Presse|Site spécialisé)/.test(f.typeSource);
    if(f.typeSource==="Réseau social"||f.typeSource==="Outil d’IA"){ eff.F=-0.5; out.push(["samuel", f.typeSource==="Réseau social"?"Un réseau social comme seule source ? Tu publierais ça dans La Revue ? Vérifie ailleurs.":"Une IA peut inventer une référence de toutes pièces. On sort d’un faux témoignage : vérifie dans une vraie source."]); }
    else if(fiable && f.verif==="Oui"){ eff.F=0.5; out.push(["samuel","Source fiable et vérifiée : c’est exactement ce que j’attends."]); }
    else if(f.verif!=="Oui"){ out.push(["samuel","Fiche acceptée, mais sans deuxième source. Pense à vérifier."]); }
    else out.push(["samuel","Fiche acceptée."]);
    if(f.corpus && corpusN>1){ eff.C=(eff.C||0)-0.5; out.push(["helene","Deuxième document du corpus utilisé comme exemple : un seul est admis. Cherchez une référence personnelle."]); }
  } else out.push(["samuel","Fiche mise à jour."]);
  const parts=applyEff(eff, "Fiche "+k);
  f.fb = lines(out)+effHtml(parts);
  S._open=k; markDirty(); render();
}
function setFb(k, html){ const el=$("#ffb_"+k); if(el) el.innerHTML=html; }

      h+=`<div class="panel"><div class="qbox"><div class="ql">Essai · développement</div><div class="qt">${esc(DATA.sujets[S.sujet-1].texte)}</div></div>`;
      [0,1,2].forEach(pi=>{
        h+=`<div class="partbox"><h3>Partie ${["I","II","III"][pi]} · ${esc(P.titres[pi])}</h3><div style="font-family:var(--serif);color:var(--lead)">${esc(P.blocs.find(b=>b.id===P.ordre[pi]).txt)}</div>`;
        [0,1].forEach(pa=>{
          const f=S.fiches[pi+"-"+pa]; const cell=S.copy.dev[pi][pa];
          h+=`<div class="parabox"><b>Paragraphe ${pa+1}</b>${f&&f.valide?`<div class="ficheMini">Votre fiche : <b>${esc(f.titre)}</b> (${esc(f.auteur)}, ${esc(f.date)}). Lien noté : ${esc(f.lien)}</div>`:`<div class="ficheMini">Pas de fiche validée pour ce paragraphe : paragraphe facultatif, ou exemple à trouver.</div>`}
            ${PARA.map(([k,l,hint])=>`<div class="caseL">${l}</div><div class="caseH">${hint}</div>${ta(`d_${pi}_${pa}_${k}`, cell[k], "sm")}`).join("")}</div>`;
        });
        h+=`</div>`;
      });
      h+=`</div>`;
    }
    if(c==="concl"){
      h+=`<div class="panel"><div class="qbox"><div class="ql">Essai · conclusion</div><div class="qt">${esc(DATA.sujets[S.sujet-1].texte)}</div></div>
        <div class="caseL">Bilan</div><div class="caseH">Répondez clairement à la problématique en reprenant le chemin parcouru.</div>${ta("c_bilan", S.copy.concl.bilan, "sm")}
        <div class="caseL">Ouverture</div><div class="caseH">Élargissez vers une question voisine, sans argument nouveau.</div>${ta("c_ouverture", S.copy.concl.ouverture, "sm")}</div>`;
    }
  }
  h += `<p class="proofnote">Votre texte s’assemble au fur et à mesure dans « Voir ma copie ».</p>` + nextBtn();
  act.innerHTML=h;
  for(const c of st.champs){
    const q=DATA.questions.find(x=>x.id===c);
    if(q) bindTa("t_"+q.id, null, v=>S.copy[q.id]=v, q.mots);
    if(c==="intro") INTRO.forEach(([k])=>bindTa("i_"+k,null,v=>S.copy.intro[k]=v));
    if(c==="dev") [0,1,2].forEach(pi=>[0,1].forEach(pa=>PARA.forEach(([k])=>bindTa(`d_${pi}_${pa}_${k}`,null,v=>S.copy.dev[pi][pa][k]=v))));
    if(c==="concl"){ bindTa("c_bilan",null,v=>S.copy.concl.bilan=v); bindTa("c_ouverture",null,v=>S.copy.concl.ouverture=v); }
  }
  bindNext(()=>{
    if(S.locked) return;
    const empty=[];
    for(const c of st.champs){
      const q=DATA.questions.find(x=>x.id===c); if(q && !S.copy[q.id].trim()) empty.push(q.label);
      if(c==="intro" && INTRO.some(([k])=>!S.copy.intro[k].trim())) empty.push("une case de l’introduction");
      if(c==="dev" && [0,1,2].some(pi=>!S.copy.dev[pi][0].arg.trim())) empty.push("le premier paragraphe d’une partie");
      if(c==="concl" && (!S.copy.concl.bilan.trim())) empty.push("le bilan");
    }
    if(empty.length){ toast("À rédiger avant de continuer : "+empty.join(", ")+"."); return false; }
    if(!S.done[st.id]) S.done[st.id]={tier:"good", eff:[]};
  });
};

// ---------------- REVIEW + EXPORT ----------------
function introText(){ return INTRO.map(([k])=>S.copy.intro[k].trim()).filter(Boolean).join(" "); }
function paraText(c){ return [c.arg,c.ex,c.ana].map(x=>x.trim()).filter(Boolean).join(" "); }
function conclText(){ return [S.copy.concl.bilan,S.copy.concl.ouverture].map(x=>x.trim()).filter(Boolean).join(" "); }
function essayWords(){ let n=words(introText())+words(conclText()); S.copy.dev.forEach(p=>p.forEach(c=>n+=words(paraText(c)))); return n; }
function findTics(t){ const l=" "+String(t).toLowerCase().replace(/[’]/g,"'")+" "; return DATA.tics.filter(x=>{ const k=x.toLowerCase().replace(/[’]/g,"'"); const re=new RegExp("(^|[^a-zàâçéèêëîïôûùüÿœ])"+k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?=$|[^a-zàâçéèêëîïôûùüÿœ])","i"); return re.test(l); }); }
function reviewAlerts(){
  const A=[];
  DATA.questions.forEach(q=>{ const t=S.copy[q.id]; const n=words(t);
    if(!t.trim()) A.push([q.label+" : réponse vide.","bad"]);
    else { if(n<q.mots[0]) A.push([`${q.label} : ${n} mots, c’est court (repère ${q.mots[0]}-${q.mots[1]}).`,"mid"]);
      if(q.id!=="q2" && !/[«"“]/.test(t)) A.push([q.label+" : aucune citation entre guillemets.","mid"]);
      if(q.id!=="q2" && !/\b(l\.|ligne|lignes)\s*\d/i.test(t)) A.push([q.label+" : aucun numéro de ligne (ex. « l. 12 »).","mid"]); }
  });
  INTRO.forEach(([k,l])=>{ if(!S.copy.intro[k].trim()) A.push(["Introduction : « "+l+" » vide.","bad"]); });
  if(S.copy.intro.problematique.trim() && !/\?\s*$/.test(S.copy.intro.problematique.trim())) A.push(["La problématique ne se termine pas par un point d’interrogation.","mid"]);
  S.copy.dev.forEach((p,pi)=>p.forEach((c,pa)=>{ const any=paraText(c); if(!any && pa===1) return; const lab=`Partie ${["I","II","III"][pi]}, paragraphe ${pa+1}`;
    if(!c.arg.trim()) A.push([lab+" : pas d’argument.","bad"]); if(!c.ex.trim()) A.push([lab+" : pas d’exemple.","mid"]); if(!c.ana.trim()) A.push([lab+" : exemple non analysé.","mid"]); }));
  if(!S.copy.concl.bilan.trim()) A.push(["Conclusion : bilan vide.","bad"]);
  if(!S.copy.concl.ouverture.trim()) A.push(["Conclusion : pas d’ouverture.","mid"]);
  const ew=essayWords(); if(ew<500) A.push([`Essai : ${ew} mots. Un essai de BTS compte en général plusieurs pages (repère : 600 à 1 000 mots).`,"mid"]);
  const all=[S.copy.q1,S.copy.q2,S.copy.q3,introText(),conclText()].concat(S.copy.dev.flat().map(paraText)).join(" ");
  const tics=findTics(all); if(tics.length) A.push(["Tics de langage repérés : « "+tics.join(" », « ")+" ».","mid"]);
  const corp=Object.values(S.fiches).filter(f=>f.valide&&f.corpus).length; if(corp>1) A.push([corp+" documents du corpus utilisés comme exemples : un seul est admis.","mid"]);
  return {A, tics};
}
RENDER.review = (st, act) => {
  const {A}=reviewAlerts(); const ew=essayWords();

    <div class="panel"><div class="tape"></div><p class="consigne">Exporter la copie</p><p>L’export télécharge votre copie au format examen (PDF). <b>Ensuite, la copie est verrouillée</b> et le corrigé pourra être débloqué par votre formateur.</p>

    const parts=applyEff(eff,"Relecture et bouclage"); if(!tics.length) applyTrust({helene:1});
    S.done[st.id]={tier:"good", eff:parts, score: tics.length?"tics repérés":"aucun tic"};
    S.locked=true; S.finished=true; S.exportedAt=new Date().toLocaleString("fr-FR");

function saveDraft(){
  const payload={app:"larevue", mission:MISSION, version:1, savedAt:new Date().toISOString(), state:cleanState()};
  download(`brouillon_LaRevue_N1_${slug(S.ident.nom)}_${stamp()}.json`, new Blob([JSON.stringify(payload,null,1)],{type:"application/json"}));
  dirty=false; lastSave=hhmm(); renderSaveState(); toast("Brouillon téléchargé. Gardez-le précieusement pour la prochaine séance.");
}
$("#fileIn").addEventListener("change", e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  const rd=new FileReader(); rd.onload=()=>{
    let p; try{ p=JSON.parse(rd.result); }catch(err){ toast("Fichier illisible ou corrompu."); return; }
    if(p && p.app==="larevue" && p.type==="corrige"){ loadCorrige(p); return; }
    if(!p||p.app!=="larevue"||!p.state){ toast("Ce fichier n’est pas un brouillon de La Revue."); return; }
    if(p.mission!==MISSION){ toast("Ce brouillon appartient à un autre numéro de La Revue."); return; }
    if(!$("#app").classList.contains("hidden") && dirty && !confirm("Remplacer la partie en cours par ce brouillon ?")) return;
    S=Object.assign(freshState(), p.state); dirty=false; lastSave="restauré "+hhmm(); CORR=null;
    if(S.corr && S.corr.epreuve){ CORR=S.corr.epreuve; }
    if(S.locked){ S.view=STEPS.length; }
    enterApp(); toast("Brouillon restauré.");
  }; rd.readAsText(f);
});

// ---------------- PDF ----------------
const WINANSI_EXTRA = "€‚ƒ„…†‡ˆ‰Š‹ŒŽ‘’“”•–—˜™š›œžŸ";
function san(t){ return Array.from(String(t??"").replace(/\u02BC/g,"’").replace(/[\u00A0\u202F\u2009]/g," ").replace(/[\u00B9\u00B2\u00B3\u2074-\u2079]/g,"").replace(/\u2042|\u2234|\u2042/g,"*")).filter(c=>c.charCodeAt(0)<256 || WINANSI_EXTRA.includes(c)).join(""); }
function PdfW(opts={}){
  const { jsPDF } = window.jspdf; const doc=new jsPDF({unit:"mm",format:"a4"});
  const W=210, H=297, ML=opts.ml||25, MR=opts.mr||18, MT=20, MB=20; let y=MT; const font=opts.font||"helvetica";
  const self={doc};
  self.need=h=>{ if(y+h>H-MB){ doc.addPage(); y=MT; } };
  self.text=(t,{size=11,style="normal",lh=1.45,indent=0,first=0,gap=2,color=[20,20,20]}={})=>{
    doc.setFont(font,style); doc.setFontSize(size); doc.setTextColor(...color);
    const width=W-ML-MR-indent; const step=size*0.3528*lh;
    String(t).split(/\n+/).forEach(par=>{ par=san(par).trim(); if(!par) return;
      let ls; if(first){ const l1=doc.splitTextToSize(par, width-first); const firstLine=l1[0]; const rest=par.slice(firstLine.length).trim(); ls=[{t:firstLine,x:ML+indent+first}].concat(rest?doc.splitTextToSize(rest,width).map(x=>({t:x,x:ML+indent})):[]); }
      else ls=doc.splitTextToSize(par,width).map(x=>({t:x,x:ML+indent}));
      ls.forEach(o=>{ self.need(step); doc.text(o.t,o.x,y+step*0.8); y+=step; }); y+=gap; });
  };
  self.h=(t,size=13,color=[31,58,95])=>{ self.need(14); y+=3; self.text(t,{size,style:"bold",color,gap:2}); };
  self.rule=()=>{ self.need(4); doc.setDrawColor(180); doc.line(ML,y,W-MR,y); y+=4; };
  self.space=v=>{ y+=v; };
  self.box=(lines,{fill=[31,58,95],tc=[255,255,255],size=10}={})=>{ doc.setFont(font,"normal"); doc.setFontSize(size); const step=size*0.3528*1.45; const ls=[]; lines.forEach(l=>doc.splitTextToSize(san(l),W-ML-MR-8).forEach(x=>ls.push(x))); const h=ls.length*step+6; self.need(h+2); doc.setFillColor(...fill); doc.rect(ML,y,W-ML-MR,h,"F"); doc.setTextColor(...tc); ls.forEach((l,i)=>doc.text(l,ML+4,y+4+step*(i+0.8))); y+=h+4; doc.setTextColor(20,20,20); };
  self.y=()=>y; self.setY=v=>{y=v;};
  self.margin=()=>{ if(!opts.marginLine) return; const n=doc.getNumberOfPages(); for(let i=1;i<=n;i++){ doc.setPage(i); doc.setDrawColor(200,16,46); doc.setLineWidth(0.3); doc.line(ML-6,10,ML-6,H-10); } };
  self.foot=(label)=>{ const n=doc.getNumberOfPages(); for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(120); doc.text(san(label)+"  -  page "+i+"/"+n, W/2, H-8, {align:"center"}); } };
  return self;
}
function pdfCopie(){
  const P=PdfW({font:"times", ml:30, mr:18, marginLine:true}); const doc=P.doc; const c=S.copy;
  doc.setDrawColor(31,58,95); doc.setLineWidth(0.4); doc.rect(30,14,162,30);
  doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.setTextColor(20);
  doc.text(san(`Nom : ${S.ident.nom.toUpperCase()}`),34,21); doc.text(san(`Prénom : ${S.ident.prenom}`),110,21);
  doc.setFont("helvetica","normal"); doc.text(san(`Classe : ${S.ident.classe||"-"}`),34,28); doc.text(san(`Date : ${new Date().toLocaleDateString("fr-FR")}`),110,28);
  doc.text(san(`BTS - ${DATA.meta.epreuve} - ${DATA.meta.session}`),34,35); doc.text(san(`Thème : ${DATA.meta.theme} - ${DATA.meta.titre}`),34,41);
  P.setY(52);
  P.h("PREMIÈRE PARTIE : QUESTIONS", 12, [20,20,20]);
  DATA.questions.forEach(q=>{ P.text(`${q.label} (${q.pts} points)`,{size:12,style:"bold",gap:1}); P.text(c[q.id]||"(Réponse non rédigée.)",{size:12,lh:1.6,first:8,gap:2}); P.space(3); });
  P.space(4); P.h("DEUXIÈME PARTIE : ESSAI", 12, [20,20,20]);
  P.text(`Sujet ${S.sujet} : ${DATA.sujets[S.sujet-1].texte}`,{size:12,style:"italic",gap:4});
  P.text(introText()||"(Introduction non rédigée.)",{size:12,lh:1.6,first:8,gap:4});
  c.dev.forEach((part,pi)=>{ part.forEach(cell=>{ const t=paraText(cell); if(t) P.text(t,{size:12,lh:1.6,first:8,gap:3}); }); if(pi<2){ P.need(8); P.doc.setFont("times","normal"); P.doc.setFontSize(12); P.doc.text("* * *", 105, P.y()+4, {align:"center"}); P.space(8); } });
  P.space(2); P.text(conclText()||"(Conclusion non rédigée.)",{size:12,lh:1.6,first:8,gap:3});
  P.margin(); P.foot(`${S.ident.prenom} ${S.ident.nom} - Copie de CGE`);
  doc.save(`copie_CGE_${slug(S.ident.nom)}_${slug(S.ident.prenom)}.pdf`);
}
function pdfBilan(){
  const P=PdfW({}); const g=S.gauges, r=rang();
  P.text("La Revue - Bilan de partie",{size:18,style:"bold",color:[31,58,95]});
  P.text(`${S.ident.prenom} ${S.ident.nom} - ${S.ident.classe}${S.ident.equipe?" - équipe "+S.ident.equipe:""} - ${DATA.meta.titre}`,{size:10});
  P.box([`Rang du numéro : ${r.nom}`, `Total : ${fr(total())}/80   Fidélité ${fr(g.F)}/20   Argumentation ${fr(g.A)}/20   Culture ${fr(g.C)}/20   Plume ${fr(g.P)}/20`, `Jetons dépensés : ${S.jetonsDep}   Bonus oraux : ${S.bonus}   Sujet d'essai : ${S.sujet}`],{size:11});
  P.h("Relations en fin de partie"); P.text(Object.keys(DATA.cast).map(k=>`${DATA.cast[k].nom} : ${S.trust[k]}/3`).join("   "),{size:10});
  P.h("Épilogue"); epilogue().forEach(([w,t])=>P.text((w==="narr"?"":DATA.cast[w].nom+" : ")+t,{size:10,gap:1}));
  P.h("Étapes et résultats");
  STEPS.forEach(st=>{ const d=S.done[st.id]; if(!d) return; const e=(d.eff||[]).map(p=>`${p.k}${p.v>0?"+":""}${fr(p.v)}`).join(" "); P.text(`${st.titre} : ${d.score||(d.choix?"choix "+d.choix:"fait")}${e?"  ["+e+"]":""}`,{size:10,gap:1}); });
  const o=S.done.s6b && DATA.steps.find(s=>s.id==="s6b").options.find(x=>x.id===S.done.s6b.choix); if(o) P.text("Analyse du choix face à Victor : "+o.expl,{size:10,style:"italic"});
  P.h("Fiches de références");
  pistesCur().forEach(p=>{ const f=S.fiches[ficheKey(p)]; if(!f||!f.valide) return; P.text(`Partie ${["I","II","III"][p.part]}, paragraphe ${p.para+1} : ${f.titre} (${f.auteur}, ${f.date}) - ${f.domaine}`,{size:10,style:"bold",gap:0}); P.text(`Source : ${f.typeSource}${f.source?" - "+f.source:""} - vérifiée : ${f.verif} - indices utilisés : ${f.niveau}`,{size:9,gap:0}); P.text(`Question de Samuel : ${f.samuel}`,{size:9,style:"italic",gap:2}); });
  if(Object.keys(S.autoeval).length||S.refaire){ P.h("Auto-évaluation"); const lab={ok:"présent",part:"partiel",non:"absent"};
    DATA.grille.questions.forEach((t,i)=>P.text(`${t} : ${lab[S.autoeval["q"+i]]||"-"}`,{size:9,gap:0})); DATA.grille.essai.forEach((t,i)=>P.text(`${t} : ${lab[S.autoeval["e"+i]]||"-"}`,{size:9,gap:0}));
    if(S.refaire) { P.space(2); P.text("Ce que je referais autrement : "+S.refaire,{size:10}); } }
  P.box(["Consigne : joignez ce bilan à votre copie si votre formateur le demande."],{fill:[200,16,46]});
  P.foot("La Revue - bilan de partie"); P.doc.save(`bilan_LaRevue_N1_${slug(S.ident.nom)}_${slug(S.ident.prenom)}.pdf`);
}
function pdfCorrige(){
  if(!CORR) return; const C=CORR, s=S.sujet, E=C.essai[s]; const P=PdfW({});
  P.text("La Revue - Éléments de corrigé",{size:18,style:"bold",color:[31,58,95]}); P.text(`${DATA.meta.epreuve} - ${DATA.meta.theme} : ${DATA.meta.titre}`,{size:10}); P.text(C.avertissement,{size:10,style:"italic"});
  DATA.questions.forEach(q=>{ const Q=C.questions[q.id]; P.h(`${q.label} (${q.pts} points)`); P.text(q.texte,{size:10,style:"italic"}); P.text("Éléments attendus",{size:10,style:"bold",gap:0}); Q.attendus.forEach(a=>P.text("- "+a,{size:10,gap:0,indent:3})); P.space(2); P.text("Réponse modèle",{size:10,style:"bold",gap:0}); Q.modele.forEach(m=>P.text(m,{size:10.5,first:6,gap:1.5})); });
  P.h(`Essai - sujet ${s}`); P.text(DATA.sujets[s-1].texte,{size:10,style:"italic"}); P.text("Problématique : "+E.problematique,{size:10,style:"bold"}); E.pieges.forEach(p=>P.text("- "+p,{size:10,gap:0,indent:3}));
  E.plans.forEach(p=>{ P.space(2); P.text(p.nom,{size:10,style:"bold",gap:0}); p.parties.forEach(x=>P.text(x,{size:10,gap:0,indent:3})); });
  P.space(2); P.text("Introduction modèle",{size:10,style:"bold",gap:0}); E.intro.forEach(([l,t])=>P.text(`${l} : ${t}`,{size:10,gap:1}));
  P.space(2); P.text("Paragraphe modèle annoté",{size:10,style:"bold",gap:0}); E.paragraphe.forEach(([l,t])=>P.text(`${l} : ${t}`,{size:10,gap:1}));
  P.h("Références possibles derrière les pistes"); C.pistes[s].forEach(p=>{ P.text(`Partie ${["I","II","III"][p.part]}, paragraphe ${p.para+1} - ${p.n1}`,{size:10,style:"bold",gap:0}); p.refs.forEach(r=>P.text("- "+r,{size:10,gap:0,indent:3})); P.space(1.5); });
  P.foot("La Revue - éléments de corrigé"); P.doc.save(`corrige_LaRevue_N1_sujet${s}.pdf`);
}
