<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jeux pédagogiques – Pierrick Frottier</title>
<meta name="description" content="Jeux de rôle en équipe pour mettre en pratique le marketing et la supply chain.">
<script>
/* =====================================================================
   LISTE DES JEUX — pour ajouter un jeu, copiez une ligne et adaptez-la.
   dossier : dossier du jeu (il contient son propre index.html et ses missions)
   ===================================================================== */
var JEUX = [
  { titre: "Studio Vigie – Étude de marché", dossier: "etude-de-marche/", description: "Chargé·e d’études junior, aidez la Brasserie des Marées à décider si elle lance une gamme de bières sans alcool, et construisez votre dossier d’étude de marché.", missions: "3 missions", emoji: "🧭", couleur: "#4f7a8c" },
  { titre: "Cellule NOMAD – Supply chain",   dossier: "supply-chain/",    description: "Agence de résilience des chaînes d’approvisionnement, aidez Altiva Outdoor à traverser ses crises : rupture fournisseur, prévision de la demande, S&OP, négociation fournisseur, production, stocks.", missions: "5 missions", emoji: "🌍", couleur: "#e07b28" }
];
</script>
<style>
:root{
  --bg:#f4f2ec; --card:#ffffff; --ink:#1d292f; --muted:#4a5a63; --line:#d6d1c4;
  --accent:#1d4f63; --accent-ink:#ffffff; --focus:#d9822b;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#1d292f; --card:#243139; --ink:#ece8dc; --muted:#b9b4a8; --line:#3a4d59;
         --accent:#ece8dc; --accent-ink:#1d292f; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:1.0625rem/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:3rem 1rem 3rem}
h1{font-size:clamp(1.8rem,4.5vw,2.6rem);line-height:1.2;margin:0 0 .5rem}
.intro{color:var(--muted);max-width:60ch;margin:0 0 2rem}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.grille{list-style:none;margin:0;padding:0;display:grid;gap:1.5rem;grid-template-columns:1fr}
@media (min-width:720px){.grille{grid-template-columns:repeat(2,1fr)}}
.carte{position:relative;display:flex;flex-direction:column;gap:.7rem;height:100%;padding:1.8rem;background:var(--card);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:16px}
.carte:hover{border-color:var(--muted);border-top-color:var(--c)}
.pastille{width:4.2rem;height:4.2rem;border-radius:50%;display:grid;place-items:center;font-size:2.2rem}
.carte h2{font-size:1.4rem;line-height:1.3;margin:.2rem 0 0}
.carte p{margin:0;color:var(--muted);flex:1}
.nb{font-size:.9rem;font-weight:600;color:var(--muted)}
.ouvrir{display:block;text-align:center;margin-top:.4rem;padding:.9rem 1rem;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:700;text-decoration:none}
.ouvrir::after{content:"";position:absolute;inset:0;border-radius:16px} /* toute la carte est cliquable */
.pied{border-top:1px solid var(--line);margin-top:3rem;padding-top:1.5rem;color:var(--muted);font-size:.95rem;display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;align-items:center}
.pied strong{color:var(--ink)}
.pied a{color:var(--ink);text-underline-offset:3px;padding:.3rem 0}
</style>
</head>
<body>
<main class="wrap">
  <h1>Jeux pédagogiques</h1>
  <p class="intro">Des jeux de rôle en équipe pour mettre en pratique le marketing et la supply chain. Choisissez votre jeu, puis la mission du jour.</p>

  <ul class="grille" id="grille"></ul>

  <footer class="pied">
    <span><strong>Pierrick Frottier</strong> · Formateur indépendant</span>
    <a href="mailto:pierrick.frottier.pro@gmail.com">pierrick.frottier.pro@gmail.com</a>
    <a href="https://www.linkedin.com/in/pierrick-frottier/" target="_blank" rel="noopener">LinkedIn</a>
    <a href="formateur/index.html">Espace formateur</a>
  </footer>
</main>

<script>
var grille = document.getElementById("grille");
JEUX.forEach(function(j){
  var li = document.createElement("li");
  li.innerHTML =
    '<article class="carte">' +
      '<div class="pastille" aria-hidden="true"></div>' +
      '<h2></h2><p></p><span class="nb"></span>' +
      '<a class="ouvrir">Voir les missions</a>' +
    '</article>';
  li.querySelector(".carte").style.setProperty("--c", j.couleur);
  var p = li.querySelector(".pastille");
  p.textContent = j.emoji; p.style.background = j.couleur + "33"; p.style.border = "2px solid " + j.couleur;
  li.querySelector("h2").textContent = j.titre;
  li.querySelector("p").textContent = j.description;
  li.querySelector(".nb").textContent = j.missions;
  var a = li.querySelector(".ouvrir");
  a.href = j.dossier + "index.html";
  a.setAttribute("aria-label", "Voir les missions : " + j.titre);
  grille.appendChild(li);
});
</script>
</body>
</html>
