<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Espace formateur – Jeux pédagogiques</title>
<style>
:root{
  --bg:#f4f2ec; --card:#ffffff; --ink:#1d292f; --muted:#4a5a63; --line:#d6d1c4;
  --accent:#1d4f63; --accent-ink:#ffffff; --focus:#d9822b; --err:#a8322d;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#1d292f; --card:#243139; --ink:#ece8dc; --muted:#b9b4a8; --line:#3a4d59;
         --accent:#ece8dc; --accent-ink:#1d292f; --err:#f08a80; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:1.0625rem/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:2.5rem 1rem 3rem}
.retour{color:var(--ink);text-underline-offset:3px}
h1{font-size:clamp(1.6rem,4vw,2.2rem);line-height:1.2;margin:1rem 0 .5rem}
.intro{color:var(--muted);margin:0 0 1.5rem}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.boite{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.4rem}
label{display:block;font-weight:600;margin-bottom:.4rem}
.ligne{display:flex;flex-wrap:wrap;gap:.75rem}
input{flex:1 1 240px;font:inherit;padding:.75rem 1rem;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
button{font:inherit;font-weight:700;padding:.75rem 1.2rem;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.msg{margin:.75rem 0 0;min-height:1.5em}
.msg.err{color:var(--err);font-weight:600}
h2.jeu{font-size:1.5rem;margin:2.5rem 0 0;padding-top:1.5rem;border-top:2px solid var(--line)}
h3{font-size:1.15rem;margin:1.5rem 0 .75rem}
ul{list-style:none;margin:0;padding:0;display:grid;gap:.6rem}
li{display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.8rem 1rem}
li span small{display:block;color:var(--muted);font-size:.85rem}
li button{padding:.55rem 1rem}
</style>
</head>
<body>
<main class="wrap">
  <a class="retour" href="../index.html">← Tous les jeux</a>
  <h1>Espace formateur</h1>
  <p class="intro">Cours, guides d’animation, corrigés et brouillons des jeux Étude de marché et Supply chain.</p>

  <form class="boite" id="form">
    <label for="mdp">Mot de passe</label>
    <div class="ligne">
      <input id="mdp" type="password" autocomplete="current-password" required>
      <button id="ok" type="submit">Ouvrir</button>
    </div>
    <p class="msg" id="msg" role="status"></p>
  </form>

  <div id="liste" hidden></div>
</main>

<script>
/* Les fichiers sont chiffrés (AES-256-GCM, clé dérivée du mot de passe par PBKDF2-SHA256).
   Ils sont produits par outils/chiffrer.mjs ; ce fichier ne contient aucun secret. */
var ITERATIONS = 600000;
var cle = null, fichiers = [];

function charger(nom) {
  return fetch("donnees/" + nom, { cache: "no-store" }).then(function (r) {
    if (!r.ok) throw new Error("Fichier introuvable : " + nom);
    return r.arrayBuffer();
  });
}
function dechiffrer(octets) { // octets = IV (12) + contenu chiffré + étiquette
  return crypto.subtle.decrypt({ name: "AES-GCM", iv: octets.slice(0, 12) }, cle, octets.slice(12));
}
function taille(n) { return n > 1e6 ? (n / 1e6).toFixed(1).replace(".", ",") + " Mo" : Math.ceil(n / 1e3) + " ko"; }

document.getElementById("form").addEventListener("submit", function (e) {
  e.preventDefault();
  var msg = document.getElementById("msg"), btn = document.getElementById("ok");
  msg.className = "msg"; msg.textContent = "Vérification…"; btn.disabled = true;
  var mdp = new TextEncoder().encode(document.getElementById("mdp").value);
  charger("manifeste.bin").then(function (buf) {
    var octets = new Uint8Array(buf);
    return crypto.subtle.importKey("raw", mdp, "PBKDF2", false, ["deriveKey"]).then(function (base) {
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt: octets.slice(0, 16), iterations: ITERATIONS, hash: "SHA-256" },
        base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    }).then(function (k) {
      cle = k;
      return dechiffrer(octets.slice(16)).catch(function () { throw new Error("Mot de passe incorrect."); });
    });
  }).then(function (clair) {
    fichiers = JSON.parse(new TextDecoder().decode(clair));
    afficher();
    document.getElementById("form").hidden = true;
    try { sessionStorage.setItem("formateur-connecte", "1"); } catch (e) {} // affiche « Ajouter une mission » sur les pages de jeu
  }).catch(function (err) {
    cle = null; msg.className = "msg err"; msg.textContent = err.message; btn.disabled = false;
  });
});

function afficher() {
  var liste = document.getElementById("liste"), jeu = null, section = null, ul;
  fichiers.forEach(function (f) {
    if (f.jeu !== jeu) {
      jeu = f.jeu; section = null;
      var hj = document.createElement("h2"); hj.className = "jeu"; hj.textContent = jeu; liste.appendChild(hj);
    }
    if (f.section !== section) {
      section = f.section;
      var h = document.createElement("h3"); h.textContent = section; liste.appendChild(h);
      ul = document.createElement("ul"); liste.appendChild(ul);
    }
    var li = document.createElement("li");
    li.innerHTML = '<span><strong></strong><small></small></span><button type="button">Télécharger</button>';
    li.querySelector("strong").textContent = f.libelle;
    li.querySelector("small").textContent = f.nom + " · " + taille(f.taille);
    var b = li.querySelector("button");
    b.setAttribute("aria-label", "Télécharger " + f.nom);
    b.onclick = function () {
      b.disabled = true; b.textContent = "Préparation…";
      charger(f.id + ".bin").then(function (buf) { return dechiffrer(new Uint8Array(buf)); }).then(function (clair) {
        var a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([clair], { type: f.type }));
        a.download = f.nom; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 10000);
        b.textContent = "Télécharger";
      }).catch(function () { b.textContent = "Erreur, réessayer"; }).then(function () { b.disabled = false; });
    };
    ul.appendChild(li);
  });
  liste.hidden = false;
}
</script>
</body>
</html>
